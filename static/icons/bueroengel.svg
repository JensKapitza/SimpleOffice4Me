  <!-- Wings -->
  <path d="M26 26 C16 20 10 22 6 30 C12 30 14 32 15 35 C19 32 23 32 27 34 Z" fill="#cfe3f7" stroke="#7fa8d0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M38 26 C48 20 54 22 58 30 C52 30 50 32 49 35 C45 32 41 32 37 34 Z" fill="#cfe3f7" stroke="#7fa8d0" stroke-width="2" stroke-linejoin="round"/>
