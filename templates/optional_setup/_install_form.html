<form class="d-inline-block me-2" method="post" action="{{ url_for('optional_setup.install') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <button type="submit" name="feature" value="{{ feature }}" class="btn btn-primary">{{ ('Retry verified download' if g.language == 'en' else 'Geprüften Download wiederholen') if retry else ('Download and enable' if g.language == 'en' else 'Laden und aktivieren') }}</button>
</form>
