{% extends "layout.html" %}
{% block body %}<main id="main-content" class="container py-4"><h1 class="h2">{{ tr('auth.profile.title') }}</h1>{% for message in get_flashed_messages() %}<div class="alert alert-info" role="status" aria-live="polite">{{ message }}</div>{% endfor %}<form method="post" class="card"><div class="card-body"><p class="text-secondary">{{ tr('auth.profile.username') }}: {{ g.user.username }}</p><label class="form-label" for="display-name">{{ tr('auth.profile.display_name') }}</label><input required class="form-control" id="display-name" name="display_name" value="{{ g.user.display_name or g.user.username }}"><div class="form-text">{{ tr('auth.profile.display_hint') }}</div><label class="form-label mt-3">{{ tr('auth.profile.email') }}</label><input readonly class="form-control" value="{{ g.user.email or '' }}"><button type="submit" class="btn btn-primary mt-3">{{ tr('auth.profile.save') }}</button></div></form></main>{% endblock %}
