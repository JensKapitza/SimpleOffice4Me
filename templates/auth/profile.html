{% extends "layout.html" %}
{% block body %}<main id="main-content" class="container py-4"><h1 class="h2">Benutzerprofil</h1>{% for message in get_flashed_messages() %}<div class="alert alert-info" role="status" aria-live="polite">{{ message }}</div>{% endfor %}<form method="post" class="card"><div class="card-body"><p class="text-secondary">Benutzername: {{ g.user.username }}</p><label class="form-label" for="display-name">Anzeigename</label><input required class="form-control" id="display-name" name="display_name" value="{{ g.user.display_name or g.user.username }}"><div class="form-text">Bei Google-Anmeldung wird der Name aus dem Google-Profil übernommen. Du kannst ihn hier überschreiben.</div><label class="form-label mt-3">E-Mail</label><input readonly class="form-control" value="{{ g.user.email or '' }}"><button type="submit" class="btn btn-primary mt-3">Profil speichern</button></div></form></main>{% endblock %}
