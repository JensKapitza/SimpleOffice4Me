{% extends 'layout.html' %}{% block title %}{{ tr('auth.invite.title') }}{% endblock %}{% block body %}<main id="main-content" class="auth-shell"><section class="auth-card"><h1>{{ tr('auth.invite.heading') }}</h1><p>{{ tr('auth.invite.lead') }}</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="invitation_token" id="invitation-token"><label class="form-label" for="password">{{ tr('auth.invite.password') }}</label><input class="form-control" id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="submit" class="btn btn-primary mt-3">{{ tr('auth.invite.submit') }}</button></form><p class="small text-secondary mt-3">{{ tr('auth.invite.expired') }}</p></section></main><script>(() => { const token = new URLSearchParams(location.hash.slice(1)).get('token') || ''; document.getElementById('invitation-token').value = token; history.replaceState(null, '', location.pathname); })();</script>{% endblock %}
