{% extends 'layout.html' %}{% block title %}{{ tr('auth.request.title') }}{% endblock %}{% block body %}<main id="main-content" class="auth-shell"><section class="auth-card"><h1>{{ tr('auth.request.heading') }}</h1><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="username">{{ tr('auth.login.username') }}</label><input class="form-control mb-3" id="username" name="username" maxlength="64" required><label for="email">{{ tr('auth.profile.email') }}</label><input class="form-control mb-3" id="email" name="email" type="email" maxlength="254" required><label for="password">{{ tr('auth.request.password') }}</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="12" maxlength="128" required><button type="submit" class="btn btn-primary w-100">{{ tr('auth.request.submit') }}</button></form></section></main>{% endblock %}
