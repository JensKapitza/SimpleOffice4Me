<!doctype html>
<html lang="{{ g.language|default('de') }}" data-theme-preference="{{ g.theme_preference|default('system') }}" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}SimpleOffice4Me{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/simpleoffice.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.8/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome-7.3.1/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block script %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">{{ 'Skip to content' if g.language|default('de') == 'en' else 'Zum Inhalt springen' }}</a>
  {% block header %}{% endblock %}
  {% block body %}{% endblock %}
  {% block footer %}{% endblock %}
  <script src="{{ url_for('static', filename='vendor/bootstrap-5.3.8/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/security.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/calendar_quick_wins.js') }}"></script>
  <script src="{{ url_for('static', filename='js/address-autocomplete.js') }}"></script>
  <script>window.SimpleOfficeTranslations = {{ ui_literal_translations|tojson }};</script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/global_ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
