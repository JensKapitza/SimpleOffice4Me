{% extends "layout.html" %}
{% block body %}<main class="container py-5"><div class="card mx-auto" style="max-width: 32rem"><div class="card-body"><h1 class="h4">Geschützte Freigabe</h1><p>Gib das Passwort ein, um die freigegebene Datei oder Notiz zu öffnen.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input required autofocus class="form-control" type="password" name="password" placeholder="Passwort"><button class="btn btn-primary mt-3">Öffnen</button></form></div></div></main>{% endblock %}
