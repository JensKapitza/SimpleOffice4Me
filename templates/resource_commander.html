<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Resource Commander</title>
  <script src="{{ url_for('static', filename='js/security.js') }}" defer></script>
  <style>
    :root{font-family:system-ui,sans-serif;color-scheme:light dark}body{margin:0;background:Canvas;color:CanvasText}header{display:flex;gap:.75rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid color-mix(in srgb,CanvasText 20%,transparent)}header a{color:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 7.6rem)}.pane{min-width:0;display:flex;flex-direction:column;border-right:1px solid color-mix(in srgb,CanvasText 20%,transparent)}.bar{display:flex;gap:.4rem;padding:.45rem;background:color-mix(in srgb,CanvasText 5%,Canvas)}select,input,button{font:inherit;padding:.38rem}.bar input{min-width:0;flex:1}.list{overflow:auto;flex:1}.row{display:grid;grid-template-columns:2rem minmax(8rem,1fr) 7rem 10rem;gap:.35rem;padding:.36rem .5rem;border-bottom:1px solid color-mix(in srgb,CanvasText 10%,transparent);cursor:default}.row:hover,.row.selected{background:color-mix(in srgb,Highlight 25%,Canvas)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{text-align:right}.status{padding:.4rem .6rem;min-height:1.4rem;border-top:1px solid color-mix(in srgb,CanvasText 15%,transparent)}footer{display:flex;gap:.5rem;align-items:center;padding:.55rem 1rem;border-top:1px solid color-mix(in srgb,CanvasText 20%,transparent)}footer button{min-width:7rem}.smart{display:none}.smart.on{display:inline-block}@media(max-width:760px){.grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.row{grid-template-columns:2rem minmax(8rem,1fr) 5rem}.row .modified{display:none}footer{overflow:auto}}
  </style>
</head>
<body>
<header><strong>Resource Commander</strong><a href="/documents/">Dokumente</a><span>F5 Kopieren · F6 Verschieben · F7 Ordner · F8 Löschen</span></header>
<main class="grid">
  {% for side in ['left','right'] %}
  <section class="pane" id="{{ side }}">
    <div class="bar">
      <select class="provider"></select>
      <button class="smart" type="button" title="SmartView für Self">SmartView</button>
      <input class="path" value="" placeholder="/">
      <button class="up" type="button">..</button>
      <button class="reload" type="button">↻</button>
    </div>
    <div class="bar"><input class="search" placeholder="Suchen"><button class="do-search" type="button">Suche</button></div>
    <div class="list" tabindex="0"></div>
    <div class="status"></div>
  </section>
  {% endfor %}
</main>
<footer>
  <button id="copy" type="button">F5 Kopieren →</button>
  <button id="move" type="button">F6 Verschieben →</button>
  <button id="mkdir" type="button">F7 Ordner</button>
  <button id="delete" type="button">F8 Löschen</button>
  <button id="swap" type="button">⇄ Seiten</button>
</footer>
<script>
(() => {
  const state={active:'left',left:{path:'',smart:false,selected:null},right:{path:'',smart:false,selected:null},providers:[]};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pane=side=>document.getElementById(side);
  const providerId=side=>pane(side).querySelector('.provider').value||'self';
  const humanSize=n=>{n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KiB';if(n<1073741824)return (n/1048576).toFixed(1)+' MiB';return (n/1073741824).toFixed(1)+' GiB'};
  async function json(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});const p=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(p.error||r.statusText);return p}
  function setStatus(side,msg){pane(side).querySelector('.status').textContent=msg||''}
  function currentPath(side){return pane(side).querySelector('.path').value.trim().replace(/^\/+|\/+$/g,'')}
  function setPath(side,value){state[side].path=value;pane(side).querySelector('.path').value=value}
  function render(side,entries){const box=pane(side).querySelector('.list');box.innerHTML='';state[side].selected=null;for(const e of entries){const row=document.createElement('div');row.className='row';row.dataset.id=e.resource_id;row.dataset.kind=e.kind;row.innerHTML=`<span>${e.kind==='folder'?'📁':'📄'}</span><span class="name" title="${esc(e.path)}">${esc(e.name)}</span><span class="size">${e.kind==='folder'?'':humanSize(e.size)}</span><span class="modified">${esc(e.modified||'')}</span>`;row.addEventListener('click',()=>{box.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');state[side].selected=e;state.active=side});row.addEventListener('dblclick',()=>{if(e.kind==='folder'){const base=currentPath(side);setPath(side,[base,e.path.split('/').pop()].filter(Boolean).join('/'));load(side)}else{window.open(`/resource-commander/api/download?provider=${encodeURIComponent(providerId(side))}&id=${encodeURIComponent(e.resource_id)}&smart=${state[side].smart?1:0}`,'_blank')}});box.append(row)}setStatus(side,`${entries.length} Einträge`)}
  async function load(side){const id=providerId(side);const smart=state[side].smart&&id==='self';const path=currentPath(side);try{setStatus(side,'Lade …');const data=await json(`/resource-commander/api/list?provider=${encodeURIComponent(id)}&path=${encodeURIComponent(path)}&smart=${smart?1:0}`);render(side,data.entries||[])}catch(e){setStatus(side,e.message)}}
  async function search(side){const q=pane(side).querySelector('.search').value.trim();if(!q)return load(side);try{const data=await json(`/resource-commander/api/search?provider=${encodeURIComponent(providerId(side))}&path=${encodeURIComponent(currentPath(side))}&q=${encodeURIComponent(q)}&smart=${state[side].smart?1:0}`);render(side,data.entries||[])}catch(e){setStatus(side,e.message)}}
  async function copy(from,to){const e=state[from].selected;if(!e)return setStatus(from,'Keine Ressource ausgewählt');if(e.kind!=='file')return setStatus(from,'Ordnerkopie: Dateien einzeln auswählen');try{setStatus(from,'Kopiere …');await json('/resource-commander/api/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_provider:providerId(from),source_smart:state[from].smart,id:e.resource_id,target_provider:providerId(to),target_path:currentPath(to),name:e.name})});await load(to);setStatus(from,'Kopiert')}catch(err){setStatus(from,err.message)}}
  async function move(from,to){const e=state[from].selected;if(!e)return setStatus(from,'Keine Ressource ausgewählt');if(providerId(from)===providerId(to)&&!state[from].smart){try{await json('/resource-commander/api/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:providerId(from),id:e.resource_id,path:currentPath(to),name:e.name})});await Promise.all([load(from),load(to)])}catch(err){setStatus(from,err.message)}}else{await copy(from,to);setStatus(from,'Provider-übergreifend wird sicher kopiert; Quelle bleibt erhalten.')}}
  async function mkdir(side){const name=prompt('Ordnername');if(!name)return;try{await json('/resource-commander/api/mkdir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:providerId(side),path:currentPath(side),name})});await load(side)}catch(e){setStatus(side,e.message)}}
  async function del(side){const e=state[side].selected;if(!e)return;if(!confirm(`${e.name} löschen?`))return;try{await json('/resource-commander/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:providerId(side),id:e.resource_id})});await load(side)}catch(err){setStatus(side,err.message)}}
  function bind(side){const p=pane(side);p.addEventListener('mousedown',()=>state.active=side);p.querySelector('.provider').addEventListener('change',()=>{state[side].smart=false;updateSmart(side);setPath(side,'');load(side)});p.querySelector('.smart').addEventListener('click',()=>{state[side].smart=!state[side].smart;setPath(side,'');updateSmart(side);load(side)});p.querySelector('.reload').onclick=()=>load(side);p.querySelector('.up').onclick=()=>{const parts=currentPath(side).split('/').filter(Boolean);parts.pop();setPath(side,parts.join('/'));load(side)};p.querySelector('.path').addEventListener('keydown',e=>{if(e.key==='Enter')load(side)});p.querySelector('.do-search').onclick=()=>search(side);p.querySelector('.search').addEventListener('keydown',e=>{if(e.key==='Enter')search(side)})}
  function updateSmart(side){const b=pane(side).querySelector('.smart');b.classList.toggle('on',providerId(side)==='self');b.textContent=state[side].smart?'SmartView ✓':'SmartView'}
  async function init(){const data=await json('/resource-commander/api/providers');state.providers=data.providers||[];for(const side of ['left','right']){const s=pane(side).querySelector('.provider');for(const p of state.providers){const o=document.createElement('option');o.value=p.provider_id;o.textContent=p.kind==='federation'?`Federation: ${p.label}`:p.label;s.append(o)}bind(side);updateSmart(side)}if(state.providers.length>1)pane('right').querySelector('.provider').selectedIndex=1;await Promise.all([load('left'),load('right')])}
  document.getElementById('copy').onclick=()=>copy(state.active,state.active==='left'?'right':'left');document.getElementById('move').onclick=()=>move(state.active,state.active==='left'?'right':'left');document.getElementById('mkdir').onclick=()=>mkdir(state.active);document.getElementById('delete').onclick=()=>del(state.active);document.getElementById('swap').onclick=()=>{const a=pane('left').querySelector('.provider').value,b=pane('right').querySelector('.provider').value,ap=currentPath('left'),bp=currentPath('right');pane('left').querySelector('.provider').value=b;pane('right').querySelector('.provider').value=a;setPath('left',bp);setPath('right',ap);load('left');load('right')};document.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();document.getElementById('copy').click()}if(e.key==='F6'){e.preventDefault();document.getElementById('move').click()}if(e.key==='F7'){e.preventDefault();document.getElementById('mkdir').click()}if(e.key==='F8'){e.preventDefault();document.getElementById('delete').click()}});init().catch(e=>setStatus('left',e.message));
})();
</script>
</body>
</html>
