<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Resource Commander</title>
  <script src="{{ url_for('static', filename='js/security.js') }}" defer></script>
  <style>
    :root{font-family:system-ui,sans-serif;color-scheme:light dark}body{margin:0;background:Canvas;color:CanvasText}header{display:flex;gap:.75rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid color-mix(in srgb,CanvasText 20%,transparent);flex-wrap:wrap}header a{color:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 8.4rem)}.pane{min-width:0;display:flex;flex-direction:column;border-right:1px solid color-mix(in srgb,CanvasText 20%,transparent)}.bar{display:flex;gap:.4rem;padding:.45rem;background:color-mix(in srgb,CanvasText 5%,Canvas)}select,input,button{font:inherit;padding:.38rem}.bar input{min-width:0;flex:1}.list{overflow:auto;flex:1}.row{display:grid;grid-template-columns:2rem 2.2rem minmax(8rem,1fr) 7rem 10rem;gap:.35rem;padding:.36rem .5rem;border-bottom:1px solid color-mix(in srgb,CanvasText 10%,transparent);cursor:default}.row:hover,.row.selected{background:color-mix(in srgb,Highlight 25%,Canvas)}.row.identical{box-shadow:inset 4px 0 green}.row.probably_identical{box-shadow:inset 4px 0 goldenrod}.row.different{box-shadow:inset 4px 0 crimson}.row.left_only,.row.right_only{box-shadow:inset 4px 0 dodgerblue}.cmp{font-weight:700;text-align:center}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{text-align:right}.status{padding:.4rem .6rem;min-height:1.4rem;border-top:1px solid color-mix(in srgb,CanvasText 15%,transparent)}footer{display:flex;gap:.5rem;align-items:center;padding:.55rem 1rem;border-top:1px solid color-mix(in srgb,CanvasText 20%,transparent);overflow:auto}footer button{min-width:7rem;white-space:nowrap}.smart{display:none}.smart.on{display:inline-block}.active-toggle{outline:2px solid Highlight}.legend{font-size:.9rem;opacity:.8}@media(max-width:760px){.grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.row{grid-template-columns:2rem 2rem minmax(8rem,1fr) 5rem}.row .modified{display:none}}
  </style>
</head>
<body>
<header><strong>Resource Commander</strong><a href="/documents/">Dokumente</a><span>F5 Kopieren · F6 Verschieben · F7 Ordner · F8 Löschen</span><span class="legend">= identisch · ~ wahrscheinlich · ≠ verschieden · →/← fehlt</span></header>
<main class="grid">
  {% for side in ['left','right'] %}
  <section class="pane" id="{{ side }}">
    <div class="bar"><select class="provider"></select><button class="smart" type="button" title="SmartView für Self">SmartView</button><input class="path" value="" placeholder="/"><button class="up" type="button">..</button><button class="reload" type="button">↻</button></div>
    <div class="bar"><input class="search" placeholder="Suchen"><button class="do-search" type="button">Suche</button></div>
    <div class="list" tabindex="0"></div><div class="status"></div>
  </section>
  {% endfor %}
</main>
<footer>
  <button id="copy" type="button">F5 Kopieren →</button><button id="move" type="button">F6 Verschieben →</button><button id="mkdir" type="button">F7 Ordner</button><button id="delete" type="button">F8 Löschen</button><button id="swap" type="button">⇄ Seiten</button><button id="compare" type="button">Diff einschalten</button><button id="complete" type="button">Hab ich alles?</button>
</footer>
<script>
(() => {
  const state={active:'left',left:{path:'',smart:false,selected:null},right:{path:'',smart:false,selected:null},providers:[],compare:false,compareBusy:false,lastComparison:null};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pane=side=>document.getElementById(side),other=side=>side==='left'?'right':'left',providerId=side=>pane(side).querySelector('.provider').value||'self';
  const humanSize=n=>{n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KiB';if(n<1073741824)return(n/1048576).toFixed(1)+' MiB';return(n/1073741824).toFixed(1)+' GiB'};
  async function json(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});const p=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(p.error||r.statusText);return p}
  function post(url,payload){return json(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}
  function setStatus(side,msg){pane(side).querySelector('.status').textContent=msg||''}
  function currentPath(side){return pane(side).querySelector('.path').value.trim().replace(/^\/+|\/+$/g,'')}
  function setPath(side,value){state[side].path=value;pane(side).querySelector('.path').value=value}
  function render(side,entries){const box=pane(side).querySelector('.list');box.innerHTML='';state[side].selected=null;for(const e of entries){const row=document.createElement('div');row.className='row';row.dataset.id=e.resource_id;row.dataset.kind=e.kind;row.dataset.name=String(e.name||'').toLocaleLowerCase();row.innerHTML=`<span>${e.kind==='folder'?'📁':'📄'}</span><span class="cmp"></span><span class="name" title="${esc(e.path)}">${esc(e.name)}</span><span class="size">${e.kind==='folder'?'':humanSize(e.size)}</span><span class="modified">${esc(e.modified||'')}</span>`;row.addEventListener('click',()=>{box.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');state[side].selected=e;state.active=side});row.addEventListener('dblclick',()=>{if(e.kind==='folder'){const base=currentPath(side);setPath(side,[base,e.path.split('/').pop()].filter(Boolean).join('/'));load(side)}else window.open(`/resource-commander/api/download?provider=${encodeURIComponent(providerId(side))}&id=${encodeURIComponent(e.resource_id)}&smart=${state[side].smart?1:0}`,'_blank')});box.append(row)}setStatus(side,`${entries.length} Einträge`)}
  function clearMarks(){for(const side of ['left','right'])pane(side).querySelectorAll('.row').forEach(r=>{r.classList.remove('identical','probably_identical','different','left_only','right_only');r.querySelector('.cmp').textContent=''})}
  function mark(side,name,status,symbol,title=''){const row=[...pane(side).querySelectorAll('.row')].find(r=>r.dataset.name===String(name||'').toLocaleLowerCase());if(!row)return;row.classList.add(status);const c=row.querySelector('.cmp');c.textContent=symbol;c.title=title}
  function applyComparison(data){clearMarks();state.lastComparison=data;for(const row of data.rows||[]){const name=row.name,status=row.status;if(status==='identical'){mark('left',name,status,'=','Sicher identisch');mark('right',name,status,'=','Sicher identisch')}else if(status==='probably_identical'){mark('left',name,status,'~','Teilprüfung stimmt');mark('right',name,status,'~','Teilprüfung stimmt')}else if(status==='different'){mark('left',name,status,'≠','Inhalt oder Typ unterschiedlich');mark('right',name,status,'≠','Inhalt oder Typ unterschiedlich')}else if(status==='left_only')mark('left',name,status,'→','Fehlt rechts');else if(status==='right_only')mark('right',name,status,'←','Fehlt links')}
    const t=data.totals||{};setStatus('left',`Diff: =${t.identical||0} ~${t.probably_identical||0} ≠${t.different||0} →${t.left_only||0}`);setStatus('right',`Diff: =${t.identical||0} ~${t.probably_identical||0} ≠${t.different||0} ←${t.right_only||0}`)}
  function comparePayload(){return{left_provider:providerId('left'),right_provider:providerId('right'),left_smart:state.left.smart,right_smart:state.right.smart,left_path:currentPath('left'),right_path:currentPath('right')}}
  async function runCompare(){if(!state.compare||state.compareBusy)return;state.compareBusy=true;try{applyComparison(await post('/resource-commander/api/compare-directory',{...comparePayload(),mode:'fast'}))}catch(e){setStatus('left','Diff: '+e.message)}finally{state.compareBusy=false}}
  async function load(side){const id=providerId(side),smart=state[side].smart&&id==='self',path=currentPath(side);try{setStatus(side,'Lade …');const data=await json(`/resource-commander/api/list?provider=${encodeURIComponent(id)}&path=${encodeURIComponent(path)}&smart=${smart?1:0}`);render(side,data.entries||[]);if(state.compare)queueMicrotask(runCompare)}catch(e){setStatus(side,e.message)}}
  async function search(side){const q=pane(side).querySelector('.search').value.trim();if(!q)return load(side);try{render(side,(await json(`/resource-commander/api/search?provider=${encodeURIComponent(providerId(side))}&path=${encodeURIComponent(currentPath(side))}&q=${encodeURIComponent(q)}&smart=${state[side].smart?1:0}`)).entries||[])}catch(e){setStatus(side,e.message)}}
  async function copy(from,to){const e=state[from].selected;if(!e)return setStatus(from,'Keine Ressource ausgewählt');if(e.kind!=='file')return setStatus(from,'Ordnerkopie: Dateien einzeln auswählen');try{setStatus(from,'Kopiere …');await post('/resource-commander/api/copy',{source_provider:providerId(from),source_smart:state[from].smart,id:e.resource_id,target_provider:providerId(to),target_path:currentPath(to),name:e.name});await load(to);setStatus(from,'Kopiert')}catch(err){setStatus(from,err.message)}}
  async function move(from,to){const e=state[from].selected;if(!e)return setStatus(from,'Keine Ressource ausgewählt');if(providerId(from)===providerId(to)&&!state[from].smart){try{await post('/resource-commander/api/move',{provider:providerId(from),id:e.resource_id,path:currentPath(to),name:e.name});await Promise.all([load(from),load(to)])}catch(err){setStatus(from,err.message)}}else{await copy(from,to);setStatus(from,'Provider-übergreifend sicher kopiert; Quelle bleibt erhalten.')}}
  async function mkdir(side){const name=prompt('Ordnername');if(!name)return;try{await post('/resource-commander/api/mkdir',{provider:providerId(side),path:currentPath(side),name});await load(side)}catch(e){setStatus(side,e.message)}}
  async function del(side){const e=state[side].selected;if(!e)return;if(!confirm(`${e.name} löschen?`))return;try{await post('/resource-commander/api/delete',{provider:providerId(side),id:e.resource_id});await load(side)}catch(err){setStatus(side,err.message)}}
  async function completeness(){const from=state.active,to=other(from);setStatus(from,'Vollständigkeitsprüfung läuft …');try{let p=comparePayload();if(from==='right')p={left_provider:p.right_provider,right_provider:p.left_provider,left_smart:p.right_smart,right_smart:p.left_smart,left_path:p.right_path,right_path:p.left_path};const data=await post('/resource-commander/api/completeness',p);applyComparison(from==='left'?data:{...data,rows:(data.rows||[]).map(r=>r.status==='left_only'?{...r,status:'right_only'}:r.status==='right_only'?{...r,status:'left_only'}:r)});const missing=(data.required_missing||[]).length,uncertain=(data.required_uncertain||[]).length;setStatus(from,data.complete?`Hab alles: ${data.rows.length} Einträge vollständig geprüft. Zusätzliche Zieldateien erlaubt.`:`Nicht vollständig: ${missing} fehlen/abweichend, ${uncertain} unklar.`)}catch(e){setStatus(from,e.message)}}
  function bind(side){const p=pane(side);p.addEventListener('mousedown',()=>state.active=side);p.querySelector('.provider').addEventListener('change',()=>{state[side].smart=false;updateSmart(side);setPath(side,'');load(side)});p.querySelector('.smart').addEventListener('click',()=>{state[side].smart=!state[side].smart;setPath(side,'');updateSmart(side);load(side)});p.querySelector('.reload').onclick=()=>load(side);p.querySelector('.up').onclick=()=>{const parts=currentPath(side).split('/').filter(Boolean);parts.pop();setPath(side,parts.join('/'));load(side)};p.querySelector('.path').addEventListener('keydown',e=>{if(e.key==='Enter')load(side)});p.querySelector('.do-search').onclick=()=>search(side);p.querySelector('.search').addEventListener('keydown',e=>{if(e.key==='Enter')search(side)})}
  function updateSmart(side){const b=pane(side).querySelector('.smart');b.classList.toggle('on',providerId(side)==='self');b.textContent=state[side].smart?'SmartView ✓':'SmartView'}
  async function init(){const data=await json('/resource-commander/api/providers');state.providers=data.providers||[];for(const side of ['left','right']){const s=pane(side).querySelector('.provider');for(const p of state.providers){const o=document.createElement('option');o.value=p.provider_id;o.textContent=p.kind==='federation'?`Federation: ${p.label}`:p.label;s.append(o)}bind(side);updateSmart(side)}if(state.providers.length>1)pane('right').querySelector('.provider').selectedIndex=1;await Promise.all([load('left'),load('right')])}
  document.getElementById('copy').onclick=()=>copy(state.active,other(state.active));document.getElementById('move').onclick=()=>move(state.active,other(state.active));document.getElementById('mkdir').onclick=()=>mkdir(state.active);document.getElementById('delete').onclick=()=>del(state.active);document.getElementById('compare').onclick=()=>{state.compare=!state.compare;const b=document.getElementById('compare');b.classList.toggle('active-toggle',state.compare);b.textContent=state.compare?'Diff aktiv':'Diff einschalten';if(state.compare)runCompare();else clearMarks()};document.getElementById('complete').onclick=completeness;document.getElementById('swap').onclick=()=>{const a=pane('left').querySelector('.provider').value,b=pane('right').querySelector('.provider').value,ap=currentPath('left'),bp=currentPath('right');pane('left').querySelector('.provider').value=b;pane('right').querySelector('.provider').value=a;setPath('left',bp);setPath('right',ap);load('left');load('right')};document.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();document.getElementById('copy').click()}if(e.key==='F6'){e.preventDefault();document.getElementById('move').click()}if(e.key==='F7'){e.preventDefault();document.getElementById('mkdir').click()}if(e.key==='F8'){e.preventDefault();document.getElementById('delete').click()}});init().catch(e=>setStatus('left',e.message));
})();
</script>
</body>
</html>
