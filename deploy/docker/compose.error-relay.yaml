services:
  simpleoffice-error-relay:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: simpleoffice4me:local
    restart: unless-stopped
    environment:
      SIMPLEOFFICE_CONTAINER_ROLE: error-relay
      SIMPLEOFFICE_HOST: 0.0.0.0
      SIMPLEOFFICE_PORT: 8080
      SIMPLEOFFICE_TRUSTED_PROXY_HOPS: ${SIMPLEOFFICE_TRUSTED_PROXY_HOPS:-0}
      SIMPLEOFFICE_ERROR_RELAY_ENABLED: "1"
      SIMPLEOFFICE_GITHUB_ERROR_REPORTING: "1"
      SIMPLEOFFICE_GITHUB_ERROR_REPOSITORY: ${SIMPLEOFFICE_GITHUB_ERROR_REPOSITORY:-JensKapitza/SimpleOffice4Me}
      SIMPLEOFFICE_GITHUB_ERROR_LABEL: ${SIMPLEOFFICE_GITHUB_ERROR_LABEL:-}
      SIMPLEOFFICE_GITHUB_ERROR_TOKEN_SOURCE: /run/secrets/github-error-token
      SIMPLEOFFICE_VERSION: ${SIMPLEOFFICE_VERSION:-}
    ports:
      - "${SIMPLEOFFICE_ERROR_RELAY_BIND_ADDRESS:-127.0.0.1}:${SIMPLEOFFICE_ERROR_RELAY_PORT:-8090}:8080"
    volumes:
      - simpleoffice-error-relay-data:/var/lib/simpleoffice4me
      - ./secrets/github-error-token:/run/secrets/github-error-token:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

volumes:
  simpleoffice-error-relay-data:
