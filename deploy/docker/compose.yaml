services:
  simpleoffice:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: simpleoffice4me:local
    restart: unless-stopped
    environment:
      SIMPLEOFFICE_CONTAINER_ROLE: web
      SIMPLEOFFICE_HOST: 0.0.0.0
      SIMPLEOFFICE_PORT: ${SIMPLEOFFICE_PORT:-8080}
      SIMPLEOFFICE_TRUSTED_PROXY_HOPS: ${SIMPLEOFFICE_TRUSTED_PROXY_HOPS:-0}
      SIMPLEOFFICE_FEDERATION_TOKEN: ${SIMPLEOFFICE_FEDERATION_TOKEN:-}
      SIMPLEOFFICE_FEDERATION_PEER_ID: ${SIMPLEOFFICE_FEDERATION_PEER_ID:-}
    ports:
      - "${SIMPLEOFFICE_BIND_ADDRESS:-127.0.0.1}:${SIMPLEOFFICE_PORT:-8080}:8080"
    volumes:
      - simpleoffice-data:/var/lib/simpleoffice4me
      # Linux/CUPS optional: uncomment if the container should use host printers.
      # - /run/cups/cups.sock:/run/cups/cups.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only needed by entrypoint to initialize a fresh named volume and then
      # switch to uid/gid 10001. The Flask/Waitress process itself runs there.
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m

volumes:
  simpleoffice-data:
