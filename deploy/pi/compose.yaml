services:
  simpleoffice4me:
    image: ghcr.io/jenskapitza/simpleoffice4me:${SIMPLEOFFICE_TAG:-latest}
    container_name: simpleoffice4me
    restart: unless-stopped
    environment:
      SIMPLEOFFICE_CONTAINER_ROLE: web
      SIMPLEOFFICE_HOST: 0.0.0.0
      SIMPLEOFFICE_PORT: 8080
      SIMPLEOFFICE_TRUSTED_PROXY_HOPS: ${SIMPLEOFFICE_TRUSTED_PROXY_HOPS:-0}
      SIMPLEOFFICE_FEDERATION_TOKEN: ${SIMPLEOFFICE_FEDERATION_TOKEN:-}
      SIMPLEOFFICE_RESOURCE_COMMANDER_TOKEN: ${SIMPLEOFFICE_RESOURCE_COMMANDER_TOKEN:-}
      SIMPLEOFFICE_RESOURCE_COMMANDER_PEER_TOKENS: ${SIMPLEOFFICE_RESOURCE_COMMANDER_PEER_TOKENS:-}
      SIMPLEOFFICE_FEDERATION_PEER_ID: ${SIMPLEOFFICE_FEDERATION_PEER_ID:-}
    ports:
      - "${SIMPLEOFFICE_BIND_ADDRESS:-0.0.0.0}:${SIMPLEOFFICE_HTTP_PORT:-8080}:8080"
    volumes:
      - simpleoffice-data:/var/lib/simpleoffice4me
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m

volumes:
  simpleoffice-data:
    name: simpleoffice4me-data
