  <text x="405" y="337" font-size="11" fill="#6b6257">synthetischer Demo-Root + Key + Checkbox</text>
  <text x="405" y="358" font-size="11" fill="#6b6257">Echtdaten abgelehnt · requires_approval</text>

  <line x1="380" y1="235" x2="200" y2="260" stroke="#7c6aa8" stroke-width="1.5" stroke-dasharray="6 4"/>
