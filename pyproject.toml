[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleoffice4me"
version = "0.1.0"
description = "Self-hosted, file-based document management"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=10,<12",
  "html5lib>=1.1,<2",
  "reportlab>=4.0,<5",
]

[tool.setuptools]
packages = ["app"]
