name: Tauri 2 builds
on:
  pull_request:
    paths:
      - 'desktop/tauri/**'
      - 'tools/prepare_tauri_client.py'
      - 'static/css/app.css'
      - 'static/vendor/bootstrap-5.3.8/css/bootstrap.min.css'
      - 'docs/assets/simpleoffice-documentation-logo.png'
      - 'pyproject.toml'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKit and build tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npm run build -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-linux
          path: desktop/tauri/src-tauri/target/release/bundle/
          if-no-files-found: error
  android-arm64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide Android SDK command-line tools.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo 'Android SDK root is not configured'; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'Android SDK command-line tools are missing'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Export NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-android-arm64
          path: desktop/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
