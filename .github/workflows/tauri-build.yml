name: Tauri 2 builds
on:
  pull_request:
    paths:
      - 'desktop/tauri/**'
      - 'tools/prepare_tauri_client.py'
      - 'tools/smoke_tauri_client.py'
      - 'tools/smoke_tauri_android.py'
      - 'tools/check_tauri_apk.py'
      - 'tools/generate_sbom.py'
      - 'static/css/app.css'
      - 'static/vendor/bootstrap-5.3.8/css/bootstrap.min.css'
      - 'docs/assets/simpleoffice-documentation-logo.png'
      - 'pyproject.toml'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned SBOM packaging helper
        run: python -m pip install --require-hashes -r ../../requirements-ci-tools.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-29)
      - name: Install WebKit and build tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb xdotool dbus-x11
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Generate locked npm dependency SBOM
        working-directory: .
        run: |
          python tools/generate_sbom.py --npm-lock desktop/tauri/package-lock.json \
            --npm-os linux --npm-cpu x64 --npm-libc gnu --output artifacts/tauri-npm-sbom.cdx.json \
            --xml-output artifacts/tauri-npm-sbom.cdx.xml
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npm run build -- -- --locked
      - name: Generate locked Rust dependency SBOM
        working-directory: .
        run: |
          cargo metadata --locked --format-version 1 --manifest-path desktop/tauri/src-tauri/Cargo.toml > "$RUNNER_TEMP/tauri-cargo-metadata.json"
          python tools/generate_sbom.py --cargo-metadata "$RUNNER_TEMP/tauri-cargo-metadata.json" --output artifacts/tauri-rust-sbom.cdx.json --xml-output artifacts/tauri-rust-sbom.cdx.xml
      - name: Install pinned CycloneDX CLI validator
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          "$validator" validate --input-file artifacts/tauri-rust-sbom.cdx.json \
            --input-format json --input-version v1_6 --fail-on-errors
          "$validator" validate --input-file artifacts/tauri-rust-sbom.cdx.xml \
            --input-format xml --input-version v1_6 --fail-on-errors
          "$validator" validate --input-file artifacts/tauri-npm-sbom.cdx.json \
            --input-format json --input-version v1_6 --fail-on-errors
          "$validator" validate --input-file artifacts/tauri-npm-sbom.cdx.xml \
            --input-format xml --input-version v1_6 --fail-on-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-npm-sbom
          path: |
            artifacts/tauri-npm-sbom.cdx.json
            artifacts/tauri-npm-sbom.cdx.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-rust-sbom
          path: |
            artifacts/tauri-rust-sbom.cdx.json
            artifacts/tauri-rust-sbom.cdx.xml
          if-no-files-found: error
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock --json > ../../artifacts/tauri-rust-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-rust-audit
          path: artifacts/tauri-rust-audit.json
          if-no-files-found: warn
      - name: Install native WebDriver test harness
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Test actual native client navigation and server selection
        working-directory: .
        run: xvfb-run -a dbus-run-session -- env WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 python tools/smoke_tauri_client.py desktop/tauri/src-tauri/target/release/simpleoffice4me_tauri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-linux
          path: desktop/tauri/src-tauri/target/release/bundle/
          if-no-files-found: error
  android-arm64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide Android SDK command-line tools.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-29)
        with:
          targets: aarch64-linux-android
      - name: Install SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo 'Android SDK root is not configured'; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'Android SDK command-line tools are missing'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Export NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npx tauri android init --ci
      - run: npm run android:build -- --target aarch64 -- --locked
      - name: Verify ARM64 APK and Android 16 KiB page compatibility
        working-directory: .
        run: |
          APK="$(find desktop/tauri/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$APK"
          python tools/check_tauri_apk.py "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-android-arm64
          path: desktop/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-29)
        with:
          targets: x86_64-linux-android
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npx tauri android init --ci
      - name: Build signed debug APK for emulator runtime validation
        run: npm run android:build -- --debug --target x86_64 -- --locked
      - name: Install existing safe XML parser for accessibility evidence
        run: python -m pip install --require-hashes -r ../../requirements-ci-tools.txt
      - name: Enable runner user access to supplied KVM device
        working-directory: .
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Exercise installed Android WebView client
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python tools/smoke_tauri_android.py "$(find desktop/tauri/src-tauri/gen/android/app/build/outputs/apk -path '*/debug/*.apk' -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-android-ui-evidence
          path: artifacts/tauri-android-ui/
          if-no-files-found: warn
