name: Tauri 2 builds
on:
  pull_request:
    paths:
      - 'desktop/tauri/**'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKit and build tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: desktop/tauri/src-tauri/target/release/bundle/
          if-no-files-found: error
  android-arm64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide Android SDK command-line tools.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install SDK components
        run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Export NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-android-arm64
          path: desktop/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
