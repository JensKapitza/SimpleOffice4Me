name: Android native wheel build (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-native-wheels.yml'
      - 'tools/check_chaquopy_wheels.py'
      - 'android/apk/app/build.gradle'

permissions:
  contents: read

jobs:
  native-wheel:
    name: Android ARM64 Python 3.15 - ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cffi
            version: '1.17.1'
          - package: Pillow
            version: '13.0.0'
          - package: cryptography
            version: '42.0.8'
          - package: reportlab
            version: '4.2.5'
          - package: argon2-cffi-bindings
            version: '21.2.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install Android NDK and cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cibuildwheel>=3,<4' 'packaging==26.3'
      - name: Attempt Android ARM64 wheel build
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp315-*
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_BUILD_VERBOSITY: '1'
          CIBW_OUTPUT_DIR: wheelhouse
          PACKAGE_SPEC: ${{ matrix.package }}==${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse sources
          python -m pip download --no-deps --no-binary :all: --dest sources "$PACKAGE_SPEC"
          archive="$(find sources -maxdepth 1 -type f | head -n 1)"
          test -n "$archive"
          mkdir -p unpacked
          case "$archive" in
            *.zip) python -m zipfile -e "$archive" unpacked ;;
            *) tar -xf "$archive" -C unpacked ;;
          esac
          source_dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          python -m cibuildwheel "$source_dir" --platform android --output-dir wheelhouse
      - name: Verify resulting Android wheels
        env:
          PACKAGE_SPEC: ${{ matrix.package }}==${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find wheelhouse -name '*.whl' -print -quit)"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.check_chaquopy_wheels import compatible_wheels
          package, version = os.environ["PACKAGE_SPEC"].split("==", 1)
          html = "".join(f'<a href="{wheel.name}">wheel</a>' for wheel in Path("wheelhouse").glob("*.whl"))
          if not compatible_wheels(html, package, version, "3.15", "arm64-v8a"):
              raise SystemExit(f"No compatible Android ARM64 Python 3.15 wheel built for {package}=={version}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-cp315-arm64-${{ matrix.package }}-wheel-attempt
          path: |
            wheelhouse/*.whl
          if-no-files-found: ignore
          retention-days: 7
