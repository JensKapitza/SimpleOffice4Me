name: Patch CI regressions
on:
  push:
    paths:
      - '.github/workflows/patch-ci-regressions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/termux-runtime-dependencies
          fetch-depth: 0
      - name: Patch regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SimpleOffice CI Fix Bot'
          git config user.email 'ci-fix-bot@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          document_store = Path('app/document_store.py')
          text = document_store.read_text(encoding='utf-8')
          old = "if re.search(r\"[^\\s()?'=0-9\\\\]\", stripped):"
          new = "if re.search(r\"[^\\s()?'=+0-9\\\\]\", stripped):"
          if old not in text:
              raise SystemExit('document search SQL whitelist pattern not found')
          document_store.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_mini_services.py')
          text = tests.read_text(encoding='utf-8')
          replacements = {
              'mock.patch("simpleoffice_mini_services.urllib.request.urlopen", return_value=Response())':
                  'mock.patch("simpleoffice_mini_services._https_open", return_value=Response())',
              'mock.patch("simpleoffice_mini_services.urllib.request.urlopen", side_effect=OSError("offline"))':
                  'mock.patch("simpleoffice_mini_services._https_open", side_effect=OSError("offline"))',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'mini services test mock pattern not found: {old}')
              text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8')
          PY
          git add app/document_store.py tests/test_mini_services.py
      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_document_store.DocumentStoreTest.test_advanced_retrieval_not_xor_nor_and_contains_use_only_index \
            tests.test_mini_services.MiniServicesConfigTests.test_failed_refresh_preserves_last_active_blocklist -v
          python -m unittest tests.test_invoice_validator_installer tests.test_termux_runtime_dependencies -v
          python -m compileall -q app tools *.py
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git add app/document_store.py tests/test_mini_services.py
          git commit -m 'Fix search and blocklist CI regressions'
          git rm .github/workflows/patch-ci-regressions.yml
          git commit --amend --no-edit
          git push origin HEAD:fix/termux-runtime-dependencies
