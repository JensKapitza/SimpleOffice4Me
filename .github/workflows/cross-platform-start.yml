name: Cross-platform startup

on:
  pull_request:
    paths:
      - start.sh
      - tools/cross_platform_start.py
      - tests/test_cross_platform_start.py
      - .github/workflows/cross-platform-start.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Unit tests
        run: python -m unittest discover -s tests -p test_cross_platform_start.py -v
      - name: Bash syntax
        shell: bash
        run: bash -n start.sh
      - name: CLI and non-installing run mode
        shell: bash
        run: |
          bash start.sh --help
          if bash start.sh run --venv .venv-that-does-not-exist; then
            echo "run unexpectedly succeeded without an installed environment" >&2
            exit 1
          fi
