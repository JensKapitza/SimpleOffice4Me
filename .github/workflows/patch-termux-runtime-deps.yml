name: Patch Termux runtime dependencies
on:
  push:
    paths:
      - '.github/workflows/patch-termux-runtime-deps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/termux-runtime-dependencies
          fetch-depth: 0
          persist-credentials: true
      - name: Patch Termux dependency bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SimpleOffice Termux Bot'
          git config user.email 'termux-bot@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The Termux paths install dependencies explicitly and then install the
          # project with --no-deps. Keep those explicit lists aligned with pyproject.
          replace_once(
              'start.sh',
              "    'Flask>=3.0,<4'\n    'beautifulsoup4>=4.12,<5'",
              "    'Flask>=3.0,<4'\n    'argon2-cffi>=23.1,<26'\n    'beautifulsoup4>=4.12,<5'",
          )
          replace_once(
              'android/setup-termux.sh',
              "  'Flask>=3.0,<4'\n  'beautifulsoup4>=4.12,<5'",
              "  'Flask>=3.0,<4'\n  'argon2-cffi>=23.1,<26'\n  'beautifulsoup4>=4.12,<5'",
          )
          replace_once(
              'start-sftp.sh',
              'TERMUX_RUNTIME_REQUIREMENTS="Flask>=3.0,<4 beautifulsoup4>=4.12,<5 reportlab>=4.0,<6 pypdf>=5.0,<7 waitress>=3.0,<4 watchdog>=6,<7 tzdata>=2024.1"',
              'TERMUX_RUNTIME_REQUIREMENTS="Flask>=3.0,<4 argon2-cffi>=23.1,<26 beautifulsoup4>=4.12,<5 defusedxml>=0.7,<1 reportlab>=4.0,<6 pypdf>=5.0,<7 waitress>=3.0,<4 watchdog>=6,<7 tzdata>=2024.1"',
          )

          # Termux has libargon2 as a native package. It is useful for source-build
          # fallback when no compatible Android wheel for argon2-cffi-bindings exists.
          replace_once(
              'start.sh',
              'printf \'%s\\n\' "clang make pkg-config libffi openssl"',
              'printf \'%s\\n\' "clang make pkg-config libffi openssl argon2"',
          )
          replace_once(
              'android/setup-termux.sh',
              'pkg install -y clang make pkg-config libffi openssl',
              'pkg install -y clang make pkg-config libffi openssl argon2',
          )
          replace_once(
              'start-sftp.sh',
              'pkg install -y clang make pkg-config libffi openssl',
              'pkg install -y clang make pkg-config libffi openssl argon2',
          )

          # Add an explicit import smoke test after pip dependency resolution so a
          # future missing password-hashing backend fails before the server starts.
          replace_once(
              'android/setup-termux.sh',
              '"$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n"$VENV/bin/python" -m pip check',
              '"$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n"$VENV/bin/python" -m pip check\n"$VENV/bin/python" -c \'from argon2 import PasswordHasher; PasswordHasher(); print("  argon2-cffi: verwendbar")\'',
          )
          replace_once(
              'start.sh',
              '"$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n  "$VENV/bin/python" -m pip check',
              '"$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n  "$VENV/bin/python" -m pip check\n  "$VENV/bin/python" -c \'from argon2 import PasswordHasher; PasswordHasher(); print("argon2-cffi ist vorhanden und verwendbar.")\'',
          )
          replace_once(
              'start-sftp.sh',
              '"$VENV_PYTHON" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n  "$VENV_PYTHON" -m pip check',
              '"$VENV_PYTHON" -m pip install --disable-pip-version-check --no-deps --editable "$ROOT"\n  "$VENV_PYTHON" -m pip check\n  "$VENV_PYTHON" -c \'from argon2 import PasswordHasher; PasswordHasher(); print("argon2-cffi ist vorhanden und verwendbar.")\'',
          )

          test = Path('tests/test_termux_runtime_dependencies.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass TermuxRuntimeDependencyTests(unittest.TestCase):\n    def test_all_termux_install_paths_include_argon2(self):\n        for relative in ("start.sh", "start-sftp.sh", "android/setup-termux.sh"):\n            text = (ROOT / relative).read_text(encoding="utf-8")\n            self.assertIn("argon2-cffi>=23.1,<26", text, relative)\n            self.assertIn("pip check", text, relative)\n            self.assertIn("from argon2 import PasswordHasher", text, relative)\n\n    def test_sftp_runtime_keeps_core_xml_dependency(self):\n        text = (ROOT / "start-sftp.sh").read_text(encoding="utf-8")\n        self.assertIn("defusedxml>=0.7,<1", text)\n\n    def test_termux_build_fallback_installs_native_argon2(self):\n        for relative in ("start.sh", "start-sftp.sh", "android/setup-termux.sh"):\n            text = (ROOT / relative).read_text(encoding="utf-8")\n            self.assertIn("argon2", text, relative)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
          git add start.sh start-sftp.sh android/setup-termux.sh tests/test_termux_runtime_dependencies.py
      - name: Validate scripts and regression test
        shell: bash
        run: |
          set -euo pipefail
          bash -n start.sh
          bash -n android/setup-termux.sh
          sh -n start-sftp.sh
          python -m unittest tests.test_termux_runtime_dependencies -v
          python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']
          required = ('argon2-cffi', 'defusedxml')
          for name in required:
              if not any(dep.lower().startswith(name) for dep in project):
                  raise SystemExit(f'{name} missing from pyproject dependencies')
          print('Termux dependency lists checked against required security dependencies.')
          PY
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Fix Termux runtime dependency bootstrap'
          git rm .github/workflows/patch-termux-runtime-deps.yml
          git commit --amend --no-edit
          git push origin HEAD:fix/termux-runtime-dependencies
