name: Patch WebDAV B314 findings

on:
  push:
    branches: [security/quick-wins-round4]
    paths: [.github/workflows/patch-webdav-b314.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace unsafe WebDAV XML parsing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/webdav.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'return (ElementTree.fromstring(serialized).text or "").strip()\n    except ElementTree.ParseError:',
                  'return (DefusedElementTree.fromstring(serialized).text or "").strip()\n    except (ElementTree.ParseError, DefusedXmlException):',
                  1,
              ),
              (
                  'element = ElementTree.fromstring(serialized)\n    except ElementTree.ParseError:',
                  'element = DefusedElementTree.fromstring(serialized)\n    except (ElementTree.ParseError, DefusedXmlException):',
                  1,
              ),
              (
                  'clone = ElementTree.fromstring(ElementTree.tostring(element, encoding="utf-8"))',
                  'clone = DefusedElementTree.fromstring(ElementTree.tostring(element, encoding="utf-8"))',
                  1,
              ),
              (
                  'element = ElementTree.fromstring(serialized)\n    if list(element):',
                  'element = DefusedElementTree.fromstring(serialized)\n    if list(element):',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = source.count(old)
              if actual != expected:
                  raise SystemExit(f"expected {expected} occurrence(s), found {actual}: {old!r}")
              source = source.replace(old, new, expected)

          if "ElementTree.fromstring(" in source.replace("DefusedElementTree.fromstring(", ""):
              raise SystemExit("stdlib ElementTree.fromstring remains in app/webdav.py")
          path.write_text(source, encoding="utf-8")
          PY
          python -m py_compile app/webdav.py
      - name: Verify B314 is gone from WebDAV
        run: |
          python -m pip install --disable-pip-version-check bandit defusedxml
          bandit app/webdav.py -f json -o /tmp/bandit.json || true
          python - <<'PY'
          import json
          data = json.load(open('/tmp/bandit.json', encoding='utf-8'))
          findings = [item for item in data.get('results', []) if item.get('test_id') == 'B314']
          if findings:
              raise SystemExit(f"remaining B314 findings: {findings}")
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-webdav-b314.yml
          git add app/webdav.py
          git commit -m "Harden WebDAV XML parsing"
          git push origin HEAD:security/quick-wins-round4
