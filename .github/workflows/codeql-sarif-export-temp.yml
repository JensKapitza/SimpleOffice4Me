name: Temporary CodeQL SARIF export

on:
  push:
    branches:
      - fix/codeql-nonbreaking-findings

permissions:
  contents: read

jobs:
  source:
    name: Export source snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codeql-source-snapshot
          path: |
            app
            tools
            tests
            static
            templates
            pyproject.toml
          include-hidden-files: true
          retention-days: 1

  analyze:
    name: Export SARIF (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, c-cpp, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze without upload
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: false
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
          retention-days: 1
