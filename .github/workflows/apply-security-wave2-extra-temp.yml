name: Temporary apply security wave 2 extra

on:
  push:
    branches:
      - fix/codeql-security-wave2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codeql-security-wave2
      - name: Escape CalDAV principal URLs in XML output
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/caldav.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ('<d:current-user-principal><d:href>{principal}</d:href></d:current-user-principal>', '<d:current-user-principal><d:href>{escape(principal)}</d:href></d:current-user-principal>'),
            ('<cal:schedule-inbox-URL><d:href>{inbox}</d:href></cal:schedule-inbox-URL>', '<cal:schedule-inbox-URL><d:href>{escape(inbox)}</d:href></cal:schedule-inbox-URL>'),
            ('<cal:schedule-outbox-URL><d:href>{outbox}</d:href></cal:schedule-outbox-URL>', '<cal:schedule-outbox-URL><d:href>{escape(outbox)}</d:href></cal:schedule-outbox-URL>'),
            ('<cal:calendar-home-set><d:href>{home}</d:href></cal:calendar-home-set>', '<cal:calendar-home-set><d:href>{escape(home)}</d:href></cal:calendar-home-set>'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Compile
        run: python -m compileall -q app/caldav.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/caldav.py
          git diff --cached --quiet && exit 0
          git commit -m "Escape CalDAV principal URLs in XML output"
          git push origin HEAD:fix/codeql-security-wave2
