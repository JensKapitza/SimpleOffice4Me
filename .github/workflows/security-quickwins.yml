name: Security quick wins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan first-party Python code
        run: bandit -r app tools *.py -x tests,libs -ll -ii
      - name: Reject Python shell execution quick wins
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.py' --exclude-dir=tests --exclude-dir=libs '(shell[[:space:]]*=[[:space:]]*True|os\.system[[:space:]]*\(|os\.popen[[:space:]]*\()' app tools . --exclude='security-quickwins.yml'; then
            echo 'Unsafe shell execution primitive found.' >&2
            exit 1
          fi
