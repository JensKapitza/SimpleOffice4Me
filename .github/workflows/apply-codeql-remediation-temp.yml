name: Temporary apply CodeQL remediation

on:
  push:
    branches:
      - fix/codeql-nonbreaking-findings
    paths:
      - tools/_codeql_nonbreaking.patch
      - .github/workflows/apply-codeql-remediation-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          ref: fix/codeql-nonbreaking-findings
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          git apply --check tools/_codeql_nonbreaking.patch
          git apply tools/_codeql_nonbreaking.patch
      - name: Syntax checks
        run: |
          python -m compileall -q app tools
          node --check static/js/inventory.js
      - name: Remove temporary remediation machinery
        run: |
          git rm tools/_codeql_nonbreaking.patch
          git rm .github/workflows/apply-codeql-remediation-temp.yml
          git rm .github/workflows/codeql-sarif-export-temp.yml
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools static templates .github/workflows
          git commit -m "Fix non-breaking CodeQL findings"
          git push origin HEAD:fix/codeql-nonbreaking-findings
