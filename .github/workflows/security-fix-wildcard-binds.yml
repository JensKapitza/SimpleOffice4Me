name: Apply wildcard bind remediation

on:
  push:
    branches:
      - security/code-scanning-remediation
    paths:
      - .github/workflows/security-fix-wildcard-binds.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bind-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/code-scanning-remediation
          fetch-depth: 0

      - name: Apply minimal source and regression-test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "simpleoffice_mini_services.py",
              '        "bind": ["0.0.0.0"],',
              '        "bind": ["127.0.0.1"],',
          )
          replace_once(
              "simpleoffice_mini_services.py",
              '    binds = dns.get("bind", ["0.0.0.0"])\n    if isinstance(binds, str):\n        binds = [binds]\n    dns["bind"] = [str(_ip(value)) for value in binds if str(value).strip()]\n    if not dns["bind"]:\n        raise ValueError("Mindestens eine DNS-Bind-Adresse ist erforderlich")',
              '    binds = dns.get("bind", ["127.0.0.1"])\n    if isinstance(binds, str):\n        binds = [binds]\n    clean_binds: list[str] = []\n    for value in binds:\n        if not str(value).strip():\n            continue\n        address = _ip(value)\n        if address.is_unspecified:\n            raise ValueError("DNS-Bind-Adresse darf nicht alle Netzwerkinterfaces umfassen")\n        clean_binds.append(str(address))\n    dns["bind"] = clean_binds\n    if not dns["bind"]:\n        raise ValueError("Mindestens eine DNS-Bind-Adresse ist erforderlich")',
          )
          replace_once(
              "simpleoffice_mini_services.py",
              '        for bind in self.config["bind"]:\n            family = socket.AF_INET6 if ":" in bind else socket.AF_INET\n            udp = socket.socket(family, socket.SOCK_DGRAM)',
              '        for bind in self.config["bind"]:\n            bind_address = _ip(bind)\n            if bind_address.is_unspecified:\n                raise ValueError("DNS-Bind-Adresse darf nicht alle Netzwerkinterfaces umfassen")\n            bind = str(bind_address)\n            family = socket.AF_INET6 if bind_address.version == 6 else socket.AF_INET\n            udp = socket.socket(family, socket.SOCK_DGRAM)',
          )

          replace_once(
              "simpleoffice_network_boot.py",
              '    "tftp_bind": "0.0.0.0",',
              '    "tftp_bind": "127.0.0.1",',
          )
          replace_once(
              "simpleoffice_network_boot.py",
              '    try:\n        socket.inet_aton(str(data.get("tftp_bind") or "0.0.0.0"))\n    except OSError as exc:\n        raise ValueError("TFTP-Bind-Adresse muss IPv4 sein") from exc\n    data["tftp_bind"] = str(data.get("tftp_bind") or "0.0.0.0")',
              '    tftp_bind = str(data.get("tftp_bind") or "127.0.0.1").strip()\n    try:\n        socket.inet_pton(socket.AF_INET, tftp_bind)\n    except OSError as exc:\n        raise ValueError("TFTP-Bind-Adresse muss IPv4 sein") from exc\n    if tftp_bind == "0.0.0.0":\n        raise ValueError("TFTP-Bind-Adresse darf nicht alle Netzwerkinterfaces umfassen")\n    data["tftp_bind"] = tftp_bind',
          )
          replace_once(
              "simpleoffice_network_boot.py",
              '    def start(self) -> None:\n        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n        sock.bind((self.settings["tftp_bind"], self.settings["tftp_port"])); sock.settimeout(1); self.socket = sock',
              '    def start(self) -> None:\n        bind = str(self.settings["tftp_bind"])\n        if bind == "0.0.0.0":\n            raise ValueError("TFTP-Bind-Adresse darf nicht alle Netzwerkinterfaces umfassen")\n        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n        sock.bind((bind, self.settings["tftp_port"])); sock.settimeout(1); self.socket = sock',
          )

          replace_once(
              "tests/test_mini_services.py",
              '        self.assertEqual(["1.1.1.1", "9.9.9.9"], config["dns"]["upstreams"])',
              '        self.assertEqual(["1.1.1.1", "9.9.9.9"], config["dns"]["upstreams"])\n        self.assertEqual(["127.0.0.1"], config["dns"]["bind"])',
          )
          replace_once(
              "tests/test_mini_services.py",
              '    def test_rejects_invalid_dhcp_timer_order(self):',
              '    def test_dns_rejects_unspecified_bind_addresses(self):\n        for bind in ("0.0.0.0", "::"):\n            with self.subTest(bind=bind):\n                config = copy.deepcopy(DEFAULT_CONFIG)\n                config["dns"]["bind"] = [bind]\n                with self.assertRaisesRegex(ValueError, "nicht alle Netzwerkinterfaces"):\n                    validate_config(config)\n\n    def test_rejects_invalid_dhcp_timer_order(self):',
          )
          replace_once(
              "tests/test_mini_services.py",
              '        self.assertFalse(settings["tftp_enabled"])',
              '        self.assertFalse(settings["tftp_enabled"])\n        self.assertEqual("127.0.0.1", settings["tftp_bind"])',
          )
          replace_once(
              "tests/test_mini_services.py",
              '    def test_pxe_architecture_and_ipxe_chain_are_separate(self):',
              '    def test_tftp_rejects_unspecified_bind_address(self):\n        settings = copy.deepcopy(DEFAULT_BOOT_SETTINGS)\n        settings["tftp_bind"] = "0.0.0.0"\n        with self.assertRaisesRegex(ValueError, "nicht alle Netzwerkinterfaces"):\n            validate_boot_settings(settings)\n\n    def test_pxe_architecture_and_ipxe_chain_are_separate(self):',
          )
          PY

          python -m py_compile simpleoffice_mini_services.py simpleoffice_network_boot.py tests/test_mini_services.py
          python -m unittest tests.test_mini_services

      - name: Commit remediation to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simpleoffice_mini_services.py simpleoffice_network_boot.py tests/test_mini_services.py
          git diff --cached --check
          git commit -m "Security: reject wildcard DNS and TFTP binds [bind-fix]"
          git push origin HEAD:security/code-scanning-remediation
