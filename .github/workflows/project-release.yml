name: Project release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: project-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch platform builds
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    outputs:
      started_at: ${{ steps.dispatched.outputs.started_at }}
    steps:
      - name: Dispatch existing platform build workflows
        id: dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          for workflow in desktop-build.yml android-apk-build.yml android-apk-release.yml server-deb-build.yml docker-build.yml; do
            gh workflow run "$workflow" --ref "$BUILD_REF"
          done

  build:
    name: Build and collect installable packages
    runs-on: ubuntu-26.04
    needs: dispatch
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version against project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for platform builds and collect run IDs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          STARTED_AT: ${{ needs.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A run_ids
          workflows=(desktop-build.yml android-apk-build.yml android-apk-release.yml server-deb-build.yml docker-build.yml)
          deadline=$((SECONDS + 21600))
          while (( SECONDS < deadline )); do
            all_done=true
            for workflow in "${workflows[@]}"; do
              [[ -n "${run_ids[$workflow]:-}" ]] && continue
              run_json="$(gh run list --workflow "$workflow" --commit "$BUILD_SHA" --limit 20 --json databaseId,status,conclusion,createdAt)"
              run_id="$(python3 -c 'import datetime,json,sys; start=datetime.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); rows=json.load(sys.stdin); print(next((str(r["databaseId"]) for r in rows if datetime.datetime.fromisoformat(r["createdAt"].replace("Z","+00:00")) >= start), ""))' "$STARTED_AT" <<<"$run_json")"
              if [[ -z "$run_id" ]]; then all_done=false; continue; fi
              run_info="$(gh run view "$run_id" --json status,conclusion)"
              status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$run_info")"
              if [[ "$status" != completed ]]; then all_done=false; continue; fi
              conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])' <<<"$run_info")"
              if [[ "$conclusion" != success ]]; then
                echo "$workflow failed (run $run_id, conclusion $conclusion)" >&2
                gh run view "$run_id" --log-failed || true
                exit 1
              fi
              run_ids[$workflow]="$run_id"
              output_key="${workflow%.yml}"
              output_key="${output_key//-/_}"
              echo "${output_key}=${run_id}" >> "$GITHUB_OUTPUT"
            done
            if $all_done && (( ${#run_ids[@]} == ${#workflows[@]} )); then break; fi
            sleep 20
          done
          if (( ${#run_ids[@]} != ${#workflows[@]} )); then
            echo "Timed out waiting for platform build workflows" >&2
            exit 1
          fi

      - name: Download platform build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-downloads
          for run_id in \
            '${{ steps.runs.outputs.desktop_build }}' \
            '${{ steps.runs.outputs.android_apk_build }}' \
            '${{ steps.runs.outputs.server_deb_build }}' \
            '${{ steps.runs.outputs.docker_build }}'; do
            mapfile -t artifacts < <(
              gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[].name | select(endswith(".dockerbuild") | not)'
            )
            if (( ${#artifacts[@]} == 0 )); then
              echo "No releasable artifacts found for run $run_id" >&2
              exit 1
            fi
            for artifact in "${artifacts[@]}"; do
              gh run download "$run_id" \
                --name "$artifact" \
                --dir "release-downloads/run-$run_id/$artifact"
            done
          done
          find release-downloads -type f -print
          test -n "$(find release-downloads -type f -print -quit)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Generate release SBOM
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --upgrade -r requirements-ci-pip.txt
          python -m pip install --editable '.[security,sbom]'
          python tools/generate_sbom.py --xml-output artifacts/sbom.cdx.xml
          python -m json.tool artifacts/sbom.cdx.json > /dev/null
          test -s artifacts/sbom.cdx.xml
          cp artifacts/sbom.cdx.json release-downloads/SimpleOffice4Me-${{ steps.version.outputs.value }}-sbom.cdx.json
          cp artifacts/sbom.cdx.xml release-downloads/SimpleOffice4Me-${{ steps.version.outputs.value }}-sbom.cdx.xml

      - name: Validate every CycloneDX inventory collected for the release
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          mapfile -d '' json_boms < <(find release-downloads -type f -name '*.cdx.json' -print0)
          mapfile -d '' xml_boms < <(find release-downloads -type f -name '*.cdx.xml' -print0)
          if (( ${#json_boms[@]} == 0 || ${#xml_boms[@]} == 0 )); then
            echo "Release artifacts must contain CycloneDX JSON and XML inventories" >&2
            exit 1
          fi
          for bom in "${json_boms[@]}"; do
            "$validator" validate --input-file "$bom" --input-format json \
              --input-version v1_6 --fail-on-errors
          done
          for bom in "${xml_boms[@]}"; do
            "$validator" validate --input-file "$bom" --input-format xml \
              --input-version v1_6 --fail-on-errors
          done

      - name: Create checksums and release archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          find release-downloads -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          tar -czf "SimpleOffice4Me-${VERSION}-Downloads.tar.gz" -C release-downloads .
          sha256sum "SimpleOffice4Me-${VERSION}-Downloads.tar.gz" > "SimpleOffice4Me-${VERSION}-Downloads.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleoffice4me-project-release-${{ steps.version.outputs.value }}
          path: |
            release-downloads/**
            SimpleOffice4Me-${{ steps.version.outputs.value }}-Downloads.tar.gz
            SimpleOffice4Me-${{ steps.version.outputs.value }}-Downloads.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download prepared release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          artifact="simpleoffice4me-project-release-${version}"
          gh run download "$GITHUB_RUN_ID" --name "$artifact" --dir release-payload
          test -s "release-payload/SimpleOffice4Me-${version}-Downloads.tar.gz"
          test -s "release-payload/SimpleOffice4Me-${version}-Downloads.tar.gz.sha256"

      - name: Publish version-tagged release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' RELEASE_FILES < <(find release-payload/release-downloads -type f -print0)
          if (( ${#RELEASE_FILES[@]} == 0 )); then
            echo "Prepared release contains no platform artifacts" >&2
            exit 1
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "SimpleOffice4Me ${VERSION#v}" \
              --generate-notes
          fi
          gh release upload "$VERSION" \
            "release-payload/SimpleOffice4Me-${VERSION#v}-Downloads.tar.gz" \
            "release-payload/SimpleOffice4Me-${VERSION#v}-Downloads.tar.gz.sha256" \
            "${RELEASE_FILES[@]}" \
            --clobber
