name: Project release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write

concurrency:
  group: project-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and collect installable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version against project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch existing platform build workflows
        id: dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          for workflow in desktop-build.yml android-apk-build.yml server-deb-build.yml docker-build.yml; do
            gh workflow run "$workflow" --ref "$BUILD_REF"
          done

      - name: Wait for platform builds and collect run IDs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          STARTED_AT: ${{ steps.dispatched.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A run_ids
          workflows=(desktop-build.yml android-apk-build.yml server-deb-build.yml docker-build.yml)
          deadline=$((SECONDS + 21600))
          while (( SECONDS < deadline )); do
            all_done=true
            for workflow in "${workflows[@]}"; do
              [[ -n "${run_ids[$workflow]:-}" ]] && continue
              run_json="$(gh run list --workflow "$workflow" --commit "$BUILD_SHA" --limit 20 --json databaseId,status,conclusion,createdAt)"
              run_id="$(python3 -c 'import datetime,json,sys; start=datetime.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); rows=json.load(sys.stdin); print(next((str(r["databaseId"]) for r in rows if datetime.datetime.fromisoformat(r["createdAt"].replace("Z","+00:00")) >= start), ""))' "$STARTED_AT" <<<"$run_json")"
              if [[ -z "$run_id" ]]; then all_done=false; continue; fi
              run_info="$(gh run view "$run_id" --json status,conclusion)"
              status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$run_info")"
              if [[ "$status" != completed ]]; then all_done=false; continue; fi
              conclusion="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])' <<<"$run_info")"
              if [[ "$conclusion" != success ]]; then
                echo "$workflow failed (run $run_id, conclusion $conclusion)" >&2
                gh run view "$run_id" --log-failed || true
                exit 1
              fi
              run_ids[$workflow]="$run_id"
              output_key="${workflow%.yml}"
              output_key="${output_key//-/_}"
              echo "${output_key}=${run_id}" >> "$GITHUB_OUTPUT"
            done
            if $all_done && (( ${#run_ids[@]} == ${#workflows[@]} )); then break; fi
            sleep 20
          done
          if (( ${#run_ids[@]} != ${#workflows[@]} )); then
            echo "Timed out waiting for platform build workflows" >&2
            exit 1
          fi

      - name: Download platform build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-downloads
          for run_id in \
            '${{ steps.runs.outputs.desktop_build }}' \
            '${{ steps.runs.outputs.android_apk_build }}' \
            '${{ steps.runs.outputs.server_deb_build }}' \
            '${{ steps.runs.outputs.docker_build }}'; do
            gh run download "$run_id" --dir "release-downloads/run-$run_id"
          done
          find release-downloads -type f -print
          test -n "$(find release-downloads -type f -print -quit)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Generate release SBOM
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --editable '.[security]'
          python tools/generate_sbom.py
          python -m json.tool artifacts/sbom.cdx.json > /dev/null
          cp artifacts/sbom.cdx.json release-downloads/SimpleOffice4Me-${{ steps.version.outputs.value }}-sbom.cdx.json

      - name: Create checksums and release archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          find release-downloads -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          tar -czf "SimpleOffice4Me-${VERSION}-Downloads.tar.gz" -C release-downloads .
          sha256sum "SimpleOffice4Me-${VERSION}-Downloads.tar.gz" > "SimpleOffice4Me-${VERSION}-Downloads.tar.gz.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Publishing requires a version tag (v$VERSION)." >&2
            exit 1
          fi
          mapfile -d '' RELEASE_FILES < <(find release-downloads -type f -print0)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "SimpleOffice4Me $VERSION" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "SimpleOffice4Me-${VERSION}-Downloads.tar.gz" \
            "SimpleOffice4Me-${VERSION}-Downloads.tar.gz.sha256" \
            "${RELEASE_FILES[@]}" \
            --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simpleoffice4me-project-release-${{ steps.version.outputs.value }}
          path: |
            release-downloads/**
            SimpleOffice4Me-${{ steps.version.outputs.value }}-Downloads.tar.gz
            SimpleOffice4Me-${{ steps.version.outputs.value }}-Downloads.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
