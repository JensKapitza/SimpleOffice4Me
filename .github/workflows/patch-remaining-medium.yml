name: Patch remaining Bandit medium findings

on:
  push:
    branches: [security/quick-wins-round4]
    paths:
      - .github/patch_remaining_medium.py
      - .github/workflows/patch-remaining-medium.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply medium hardening
        run: python .github/patch_remaining_medium.py
      - name: Verify syntax
        run: >-
          python -m py_compile
          app/business_documents.py app/document_store.py app/fritzbox_contacts.py app/__init__.py
          app/osm_address.py app/mini_services_admin.py simpleoffice_mini_services.py simpleoffice_network_boot.py
      - name: Verify no medium Bandit findings remain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check bandit
          bandit -r app tools *.py -x tests,libs -f json -o /tmp/bandit.json || true
          python - <<'PY'
          import json
          data = json.load(open('/tmp/bandit.json', encoding='utf-8'))
          findings = [item for item in data.get('results', []) if item.get('issue_severity') == 'MEDIUM']
          if findings:
              for item in findings:
                  print(item.get('test_id'), item.get('filename'), item.get('line_number'), item.get('code'))
              raise SystemExit(f'{len(findings)} medium Bandit finding(s) remain')
          print('Medium Bandit findings: 0')
          PY
      - name: Commit patch and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch_remaining_medium.py .github/workflows/patch-remaining-medium.yml
          git add app/business_documents.py app/document_store.py app/fritzbox_contacts.py app/__init__.py app/osm_address.py app/mini_services_admin.py simpleoffice_mini_services.py simpleoffice_network_boot.py templates
          git commit -m "Eliminate remaining Bandit medium findings"
          git push origin HEAD:security/quick-wins-round4
