name: Release security, protocols and performance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'setup.py'
      - 'tools/generate_sbom.py'
      - 'tests/test_security_baseline.py'
      - '.github/workflows/release-security-protocol-performance.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: release-sp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: python -m pip install -e '.[sbom]'
      - name: Security and protocol regression suites
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_security_baseline.py' -v
          python -m unittest discover -s tests -p 'test_s3_overlay.py' -v
          python -m unittest discover -s tests -p 'test_v2_federation_multi_instance_policy.py' -v
      - name: Check Python syntax
        run: python -m py_compile tests/ci_http_performance.py
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: python -m pip install -e .
      - name: Bounded HTTP performance smoke
        env:
          PERF_REQUESTS: '120'
          PERF_CONCURRENCY: '6'
          PERF_MAX_P95_MS: '2000'
          PERF_MAX_ERROR_RATE: '0'
        run: python tests/ci_http_performance.py
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-http-performance
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 14
