name: Extended quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: extended-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install static analyzer
        run: python -m pip install --require-hashes -r requirements-ci-ruff.txt
      - name: Run Python static analysis
        run: ruff check app tools tests *.py
      - name: Compile all first-party Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tools
          python - <<'PY'
          import py_compile
          from pathlib import Path
          files = sorted(Path('.').glob('*.py'))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(files)} top-level Python files')
          PY
      - name: Validate project policy and source limits
        run: |
          python tools/check_project_policy.py .
          python tools/check_file_size.py . --limit 1000
          python tools/check_function_size.py app tools --limit 300
      - name: Reject conflict markers and whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- ':!*.md'; then
            echo 'Merge conflict marker found.' >&2
            exit 1
          fi
          git diff-tree --check --no-commit-id --root -r HEAD
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ignored = {'.git', '.venv', '.vscode', 'node_modules', 'dist', 'build'}
          files = [p for p in Path('.').rglob('*.json') if not ignored.intersection(p.parts)]
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          print(f'validated {len(files)} JSON files')
          PY
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (("${#scripts[@]}")); then
            bash -n "${scripts[@]}"
          fi
      - name: Audit Mini Services diagnostics
        run: python tools/mini_services_log_audit.py
  js-syntax:
    name: First-party JavaScript syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Syntax-check first-party browser scripts
        shell: bash
        run: |
          set -euo pipefail
          # Plain classic scripts only (no ESM import/export in static/js);
          # vendor bundles and the Electron build's own sources are excluded:
          # vendor code is third-party, desktop JS is parsed by its build.
          mapfile -d '' files < <(find static/js -type f -name '*.js' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No first-party scripts found" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} first-party scripts"
          failed=0
          for file in "${files[@]}"; do
            node --check "$file" || { echo "SYNTAX ERROR in $file" >&2; failed=1; }
          done
          exit "$failed"
      - name: Mini Services software acceptance smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.mini_services_benchmark --iterations 1 > /tmp/mini-services-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/mini-services-benchmark.json').read_text())
          expected = {'dhcp', 'dns', 'tftp', 'sip'}
          if set(report.get('services', {})) != expected:
              raise SystemExit('mini-services benchmark did not cover the expected listener services')
          if report.get('remaining_threads'):
              raise SystemExit('mini-services benchmark leaked listener threads')
          for service, values in report['services'].items():
              for metric in ('construct_ms', 'python_heap_peak_kib', 'start_ms', 'stop_ms', 'duplicate_start_ms', 'cpu_ms'):
                  row = values.get(metric)
                  if not isinstance(row, dict) or row.get('median', -1) < 0 or row.get('max', -1) < 0:
                      raise SystemExit(f'{service}: invalid {metric} measurement')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
