name: Extended quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: extended-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install --editable .
      - name: Compile all first-party Python
        run: python -m compileall -q app tools *.py
      - name: Validate project policy and source limits
        run: |
          python tools/check_project_policy.py .
          python tools/check_file_size.py . --limit 1000
          python tools/check_function_size.py app tools --limit 300
      - name: Reject conflict markers and trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.md'; then
            echo 'Merge conflict marker found.' >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ignored = {'.git', '.venv', 'node_modules', 'dist', 'build'}
          files = [p for p in Path('.').rglob('*.json') if not ignored.intersection(p.parts)]
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          print(f'validated {len(files)} JSON files')
          PY
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (("${#scripts[@]}")); then bash -n "${scripts[@]}"; fi

  web-contract:
    name: Web templates and accessibility contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install --editable .
      - name: Run template and accessibility regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*accessib*.py' -v
          python -m unittest discover -s tests -p 'test_*frontend*.py' -v
          python -m unittest discover -s tests -p 'test_*ui*.py' -v

  security-contract:
    name: Security negative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install --editable ".[security]"
      - name: Run security-focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, sys
          tests = sorted({
              p for pattern in ('test_*security*.py', 'test_*csrf*.py', 'test_*ssrf*.py', 'test_*auth*.py')
              for p in pathlib.Path('tests').glob(pattern)
          })
          print(f'running {len(tests)} security test modules')
          for test in tests:
              subprocess.run([sys.executable, str(test)], check=True)
          PY
      - name: Audit dependencies
        run: python -m pip_audit
