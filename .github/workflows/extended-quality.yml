name: Extended quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: extended-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile all first-party Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tools
          python - <<'PY'
          import py_compile
          from pathlib import Path
          files = sorted(Path('.').glob('*.py'))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(files)} top-level Python files')
          PY
      - name: Validate project policy and source limits
        run: |
          python tools/check_project_policy.py .
          python tools/check_file_size.py . --limit 1000
          python tools/check_function_size.py app tools --limit 300
      - name: Reject conflict markers and whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- ':!*.md'; then
            echo 'Merge conflict marker found.' >&2
            exit 1
          fi
          git diff-tree --check --no-commit-id --root -r HEAD
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ignored = {'.git', '.venv', 'node_modules', 'dist', 'build'}
          files = [p for p in Path('.').rglob('*.json') if not ignored.intersection(p.parts)]
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          print(f'validated {len(files)} JSON files')
          PY
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (("${#scripts[@]}")); then
            bash -n "${scripts[@]}"
          fi
