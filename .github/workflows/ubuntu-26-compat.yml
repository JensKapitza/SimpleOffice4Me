name: Ubuntu 26.04 compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'android/apk/**'
      - 'desktop/**'
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - 'tools/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'build-dep.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ubuntu-26-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python application
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[security,sftp]"
      - name: Run policy, compile and unit-test gates
        run: |
          python tools/check_project_policy.py .
          python tools/check_file_size.py . --limit 1000
          python tools/check_function_size.py app tools --limit 300
          python -m compileall -q app tools
          python -m unittest discover -s tests -v

  desktop-linux:
    name: Desktop Linux packaging
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Build and package desktop application
        working-directory: desktop/electron
        run: |
          npm run sync:version
          npm run build:backend
          npm run package:desktop
      - name: Verify AppImage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find desktop/electron/dist -maxdepth 1 -type f -name '*.AppImage' -print)
          test "${#appimages[@]}" -eq 1
          chmod +x "${appimages[0]}"
          file "${appimages[0]}" | grep -E 'ELF 64-bit.*x86-64'
          "${appimages[0]}" --appimage-version

  android-native-wheels:
    uses: ./.github/workflows/android-native-wheels.yml

  android-arm64:
    name: Android ARM64 toolchain
    needs: android-native-wheels
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      SIMPLEOFFICE_ANDROID_ABI: arm64-v8a
      SIMPLEOFFICE_ANDROID_PYTHON: '3.15'
      SIMPLEOFFICE_ANDROID_WHEEL_DIR: ${{ github.workspace }}/android/apk/app/wheelhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp315-arm64-Pillow-wheel
          path: android/apk/app/wheelhouse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp315-arm64-cryptography-wheel
          path: android/apk/app/wheelhouse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp315-arm64-cffi-wheel
          path: android/apk/app/wheelhouse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp315-arm64-argon2-cffi-bindings-wheel
          path: android/apk/app/wheelhouse
      - name: Verify native wheel artifacts
        shell: bash
        run: |
          cd android/apk/app/wheelhouse
          sha256sum --check Pillow-SHA256SUMS cryptography-SHA256SUMS cffi-SHA256SUMS argon2-cffi-bindings-SHA256SUMS
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Preflight Android wheels and install ReportLab wheel
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt
          python tools/check_chaquopy_wheels.py \
            --python "$SIMPLEOFFICE_ANDROID_PYTHON" \
            --abi "$SIMPLEOFFICE_ANDROID_ABI" \
            --wheel-dir android/apk/app/wheelhouse
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'
      - name: Build and verify APK
        working-directory: android/apk
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK host tools
        shell: bash
        run: |
          set -euo pipefail
          APK=android/apk/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

  browser-host:
    # Playwright does not yet publish a Chromium/dependency bundle for Ubuntu 26.04.
    # Keep the browser smoke host on 24.04 until upstream support lands; the other
    # jobs in this workflow exercise the 26.04 runner migration explicitly.
    name: Playwright Chromium host dependencies (Ubuntu 24.04 compatibility hold)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium dependencies
        run: |
          python -m pip install 'playwright==1.55.0' 'Jinja2>=3.1.2,<4'
          python -m playwright install --with-deps chromium
          python -m playwright install --list
      - name: Resource Commander browser regressions
        run: python -m unittest discover -s tests -p test_resource_commander_browser.py -v

  docker-host:
    name: Docker and Buildx host
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Docker host and Compose
        run: |
          docker version
          docker compose version
          docker compose -f deploy/pi/compose.yaml config >/dev/null
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create disposable local-secret sentinels for image-context test
        id: context-sentinel
        shell: bash
        run: |
          set -euo pipefail
          sentinel="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e .env
          test ! -e ".env.${sentinel}"
          test ! -e deploy/docker/secrets
          printf 'name=%s\n' "$sentinel" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'not-a-credential-build-context-sentinel' > ".env.${sentinel}"
          mkdir -p deploy/docker/secrets
          printf '%s\n' 'not-a-credential-build-context-sentinel' > "deploy/docker/secrets/${sentinel}"
          printf '%s\n' 'not-a-credential-build-context-sentinel' > .env
      - name: Build amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: simpleoffice4me:local
      - name: Verify local secret files are absent from the image
        env:
          SENTINEL: ${{ steps.context-sentinel.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SENTINEL"
          docker run --rm --entrypoint /bin/sh -e SENTINEL simpleoffice4me:local \
            -eu -c 'test ! -e /opt/simpleoffice4me/.env && test ! -e "/opt/simpleoffice4me/.env.$SENTINEL" && test ! -e "/opt/simpleoffice4me/deploy/docker/secrets/$SENTINEL"'
      - name: Remove disposable local-secret sentinels
        if: always()
        env:
          SENTINEL: ${{ steps.context-sentinel.outputs.name }}
        shell: bash
        run: |
          if [ -n "${SENTINEL:-}" ]; then
            rm -f .env ".env.${SENTINEL}" "deploy/docker/secrets/${SENTINEL}"
            if [ -d deploy/docker/secrets ]; then rmdir deploy/docker/secrets; fi
          fi
      - name: Run isolated federation restart smoke
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/docker/compose.federation-test.yaml)
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              "${compose[@]}" ps
              "${compose[@]}" logs --no-color
            fi
            "${compose[@]}" down --volumes --remove-orphans
            exit "$result"
          }
          trap cleanup EXIT

          "${compose[@]}" up --detach --no-build --wait --wait-timeout 180
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_seed
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_seed
          "${compose[@]}" exec -T relay python -m tools.federation_testnet_seed \
            --configure-relay-node
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_smoke \
            --expect-receive direct_trust_required --relay-action denied
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_seed \
            --confirm-local-peer --enable-test-relay
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_seed \
            --confirm-local-peer --enable-test-relay
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_smoke \
            --expect-receive pending --relay-action send
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_smoke \
            --expect-receive pending
          "${compose[@]}" restart peer-b relay
          "${compose[@]}" up --detach --no-build --wait --wait-timeout 180
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_smoke \
            --expect-receive duplicate
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_smoke \
            --expect-receive duplicate --relay-action receive
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_seed \
            --confirm-local-peer
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_seed \
            --confirm-local-peer
          "${compose[@]}" exec -T peer-a python -m tools.federation_testnet_smoke \
            --expect-receive duplicate --relay-action denied
          "${compose[@]}" exec -T peer-b python -m tools.federation_testnet_smoke \
            --expect-receive duplicate --relay-action denied

  server-deb-host:
    name: Server DEB host tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SIMPLEOFFICE_SERVER_PUBLIC_URL: https://ci.simpleoffice4me.invalid
      SIMPLEOFFICE_SERVER_PEER_ID: license-master-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build server DEB on its Debian 12 target
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i             -v "$PWD:/work"             -w /work             -e SIMPLEOFFICE_SERVER_PUBLIC_URL             -e SIMPLEOFFICE_SERVER_PEER_ID             debian:12-slim bash -s <<'INNER'
          set -euo pipefail
          bash ./build-dep.sh
          bash packaging/build-server.sh
          INNER
      - name: Verify Ubuntu 26.04 host can inspect package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find dist/packages -maxdepth 1 -type f -name 'simpleoffice4me-server_*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = simpleoffice4me-server
          dpkg-deb -c "$DEB" >/dev/null
