# Static analysis with Microsoft Security DevOps (MSDO).
# The legacy github/ossar-action@v1 targets Node.js 20 and is deprecated.
name: OSSAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '27 21 * * 3'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  OSSAR-Scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run Microsoft Security DevOps
      # Pinned to a reviewed Node.js 24 commit from microsoft/security-devops-action.
      uses: microsoft/security-devops-action@241d09d34a00dc03aad8b1e8cf988a6f66ecd3f5
      id: msdo

    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}
