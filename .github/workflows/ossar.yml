# Static analysis with Microsoft Security DevOps (MSDO).
# Replaces github/ossar-action@v1, which targets deprecated Node.js 20.
name: OSSAR

on:
  push:
    branches: [ "main", "hackathon/contextflow-mvp" ]
  pull_request:
    branches: [ "main", "hackathon/contextflow-mvp" ]
  schedule:
    - cron: '27 21 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  OSSAR-Scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@9fe580e3cbc6c40cc75ffa96061ea94fcdbcf0d8
        id: msdo
        with:
          # Bandit is intentionally omitted here. The MSDO Windows package can
          # currently fail before scanning because its generated Bandit launcher
          # path exceeds the Windows process path limit. Python code is still
          # scanned with Bandit in security-quickwins.yml.
          tools: checkov,eslint,templateanalyzer,terrascan,trivy

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
