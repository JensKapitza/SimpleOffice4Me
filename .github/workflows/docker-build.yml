name: Docker build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'tools/generate_sbom.py'
      - 'tools/check_container_image_sbom.py'
      - 'tests/test_sbom_xml.py'
      - 'tests/test_container_image_sbom.py'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/simpleoffice4me

jobs:
  artifact:
    name: Docker ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install pinned SBOM metadata parser
        run: python -m pip install 'packaging==26.3'

      - name: Validate Raspberry Pi deployment files
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/pi/bootstrap.sh deploy/pi/install.sh deploy/pi/update.sh deploy/pi/backup.sh
          docker compose -f deploy/pi/compose.yaml config >/dev/null

      - name: Resolve SimpleOffice version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          BUILD_EPOCH="$(git show -s --format=%ct HEAD)"
          REVISION="$(git rev-parse HEAD)"
          RELEASE_VERSION="$(python - <<'PY'
          from simpleoffice_version import build_info
          print(build_info()['release_version'])
          PY
          )"
          VERSION="$(SIMPLEOFFICE_BUILD_NUMBER="$BUILD_NUMBER" SIMPLEOFFICE_BUILD_EPOCH="$BUILD_EPOCH" SIMPLEOFFICE_BUILD_REVISION="$REVISION" python - <<'PY'
          from simpleoffice_version import build_info
          print(build_info()['version'])
          PY
          )"
          cat > .simpleoffice-release.json <<EOF
          {"commit_count": $BUILD_NUMBER, "build_epoch": $BUILD_EPOCH, "revision": "$REVISION"}
          EOF
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build portable Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=/tmp/SimpleOffice4Me-Docker-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar
          tags: simpleoffice4me:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=SimpleOffice4Me
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Generate CycloneDX SBOM from the built container environment
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/SimpleOffice4Me-Docker-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar"
          image="simpleoffice4me:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          container="simpleoffice-sbom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          site_packages="artifacts/container/${{ matrix.arch }}/site-packages"
          marker_environment="artifacts/container/${{ matrix.arch }}/marker-environment.json"
          mkdir -p "artifacts/container/${{ matrix.arch }}"
          docker load --input "$archive"
          docker create --name "$container" "$image" > /dev/null
          trap 'docker rm -f "$container" > /dev/null 2>&1 || true' EXIT
          docker cp \
            "$container:/opt/simpleoffice4me/.venv/lib/python3.12/site-packages" \
            "artifacts/container/${{ matrix.arch }}/"
          docker rm "$container" > /dev/null
          trap - EXIT
          docker run --rm --network none \
            --entrypoint /opt/simpleoffice4me/.venv/bin/python "$image" -c '
          import json
          import os
          import platform
          import sys

          print(json.dumps({
              "implementation_name": sys.implementation.name,
              "implementation_version": platform.python_version(),
              "os_name": os.name,
              "platform_machine": platform.machine(),
              "platform_python_implementation": platform.python_implementation(),
              "platform_release": platform.release(),
              "platform_system": platform.system(),
              "platform_version": platform.version(),
              "python_full_version": platform.python_version(),
              "python_version": f"{sys.version_info.major}.{sys.version_info.minor}",
              "sys_platform": sys.platform,
          }, sort_keys=True))
          ' > "$marker_environment"
          python tools/generate_sbom.py \
            --python-environment "$site_packages" --marker-environment "$marker_environment" \
            --extra ocr \
            --output "artifacts/container/${{ matrix.arch }}-python.cdx.json" \
            --xml-output "artifacts/container/${{ matrix.arch }}-python.cdx.xml"
          python -m json.tool "artifacts/container/${{ matrix.arch }}-python.cdx.json" > /dev/null

          syft_archive="$RUNNER_TEMP/syft.tar.gz"
          syft_directory="$RUNNER_TEMP/syft"
          mkdir -p "$syft_directory"
          curl --fail --location --retry 3 \
            https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz \
            --output "$syft_archive"
          printf '%s  %s\n' \
            'bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d' \
            "$syft_archive" | sha256sum --check --status
          tar -xzf "$syft_archive" -C "$syft_directory" syft
          "$syft_directory/syft" "$image" \
            -o "cyclonedx-json@1.6=artifacts/container/${{ matrix.arch }}-image.cdx.json" \
            -o "cyclonedx-xml@1.6=artifacts/container/${{ matrix.arch }}-image.cdx.xml"
          python tools/check_container_image_sbom.py \
            --python-sbom "artifacts/container/${{ matrix.arch }}-python.cdx.json" \
            --image-sbom "artifacts/container/${{ matrix.arch }}-image.cdx.json"

          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          for bom in artifacts/container/${{ matrix.arch }}-python.cdx.json artifacts/container/${{ matrix.arch }}-image.cdx.json; do
            "$validator" validate --input-file "$bom" \
              --input-format json --input-version v1_6 --fail-on-errors
          done
          for bom in artifacts/container/${{ matrix.arch }}-python.cdx.xml artifacts/container/${{ matrix.arch }}-image.cdx.xml; do
            "$validator" validate --input-file "$bom" \
              --input-format xml --input-version v1_6 --fail-on-errors
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleoffice4me-container-python-sbom-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            artifacts/container/${{ matrix.arch }}-python.cdx.json
            artifacts/container/${{ matrix.arch }}-python.cdx.xml
            artifacts/container/${{ matrix.arch }}-image.cdx.json
            artifacts/container/${{ matrix.arch }}-image.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Compress Docker image
        run: gzip -9 /tmp/SimpleOffice4Me-Docker-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleoffice4me-docker-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: /tmp/SimpleOffice4Me-Docker-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish multi-arch image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve SimpleOffice version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          BUILD_EPOCH="$(git show -s --format=%ct HEAD)"
          REVISION="$(git rev-parse HEAD)"
          RELEASE_VERSION="$(python - <<'PY'
          from simpleoffice_version import build_info
          print(build_info()['release_version'])
          PY
          )"
          VERSION="$(SIMPLEOFFICE_BUILD_NUMBER="$BUILD_NUMBER" SIMPLEOFFICE_BUILD_EPOCH="$BUILD_EPOCH" SIMPLEOFFICE_BUILD_REVISION="$REVISION" python - <<'PY'
          from simpleoffice_version import build_info
          print(build_info()['version'])
          PY
          )"
          cat > .simpleoffice-release.json <<EOF
          {"commit_count": $BUILD_NUMBER, "build_epoch": $BUILD_EPOCH, "revision": "$REVISION"}
          EOF
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.release_version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=SimpleOffice4Me
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Build and publish multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish
          provenance: mode=max
          sbom: true
