name: Tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime-start:
    name: Windows runtime selection
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify existing venv selection and rejection before installation
        run: python -m unittest discover -s tests -p test_windows_runtime_start.py -v

  pr-regression:
    name: PR regression (Python 3.14)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install application
        run: python -m pip install --editable ".[security]"
      - name: Run launcher, packaging, Android workflow and runtime regression tests
        run: |
          python -m unittest discover -s tests -p 'test_python_runtime_support.py' -v
          python -m unittest discover -s tests -p 'test_start_script.py' -v
          python -m unittest discover -s tests -p 'test_android_apk_build_matrix.py' -v
      - name: Validate policy and compilation
        run: |
          python tools/check_project_policy.py .
          python -m compileall -q app tools

  tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.runtime }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.10", os: ubuntu-22.04, runtime: jammy-system}
          - {python-version: "3.11", os: ubuntu-24.04, runtime: stable}
          - {python-version: "3.14", os: ubuntu-24.04, runtime: stable}
          - {python-version: "3.15.0-rc.3", os: ubuntu-24.04, runtime: prerelease}
    env:
      SIMPLEOFFICE_ALLOW_PRERELEASE: ${{ matrix.runtime == 'prerelease' && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Canonical Jammy Python (no setup-python upstream 3.10)
        if: matrix.runtime == 'jammy-system'
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade python3.10 python3.10-minimal libpython3.10-stdlib libpython3.10-minimal
          sudo apt-get install -y python3.10-venv
          /usr/bin/python3.10 -m venv "$RUNNER_TEMP/jammy-python"
          echo "$RUNNER_TEMP/jammy-python/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        if: matrix.runtime != 'jammy-system'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create authenticated Jammy runtime proof
        if: matrix.runtime == 'jammy-system'
        run: sudo /usr/bin/python3.10 simpleoffice_runtime_support.py --write-proof
      - name: Check runtime support contract
        run: python simpleoffice_runtime_support.py
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[security]"
      - name: Install existing optional SFTP extra for transport coverage
        if: matrix.python-version == '3.14'
        run: python -m pip install --editable ".[sftp]"
      - name: Enforce project policy consistency
        run: python tools/check_project_policy.py .
      - name: Enforce source file size limit
        run: python tools/check_file_size.py . --limit 1000
      - name: Enforce function size limit
        run: python tools/check_function_size.py app tools --limit 300
      - name: Compile Python sources
        run: python -m compileall -q app tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  litellm-operations:
    if: github.event_name != 'pull_request'
    name: LiteLLM optional container operations
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install core application without LiteLLM Python dependencies
        run: python -m pip install --editable .
      - name: Pull configured pinned LiteLLM image
        run: |
          LITELLM_IMAGE=$(python -c 'from app.litellm_config import DEFAULTS, image_reference; print(image_reference(DEFAULTS))')
          docker pull "$LITELLM_IMAGE"
      - name: Exercise real optional container operations with a non-billable model
        run: python tools/litellm_smoke.py

  docker-error-relay:
    if: github.event_name != 'pull_request'
    name: Docker error relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate relay Compose file
        run: docker compose -f deploy/docker/compose.error-relay.yaml config > /dev/null
      - name: Build shared SimpleOffice image
        run: docker build --tag simpleoffice4me:error-relay-ci .
      - name: Smoke-test restricted relay role
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/simpleoffice-error-relay-token"
          printf '%s\n' 'ci-placeholder-not-a-real-token' > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          docker run -d --name simpleoffice-error-relay-ci \
            --read-only \
            --pids-limit 128 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add DAC_READ_SEARCH \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /var/lib/simpleoffice4me:rw,nosuid,nodev,noexec,size=128m \
            -e SIMPLEOFFICE_CONTAINER_ROLE=error-relay \
            -e SIMPLEOFFICE_ERROR_RELAY_ENABLED=1 \
            -e SIMPLEOFFICE_GITHUB_ERROR_REPORTING=1 \
            -e SIMPLEOFFICE_GITHUB_ERROR_TOKEN_SOURCE=/run/secrets/github-error-token \
            -v "$TOKEN_FILE:/run/secrets/github-error-token:ro" \
            -p 127.0.0.1:18090:8080 \
            simpleoffice4me:error-relay-ci
          trap 'docker logs simpleoffice-error-relay-ci || true; docker rm -f simpleoffice-error-relay-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            status="$(curl -sS -o /tmp/relay-health.json -w '%{http_code}' http://127.0.0.1:18090/api/error-reports/v1/health || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 0.5
          done
          test "${status:-}" = "200"
          python -m json.tool /tmp/relay-health.json > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/error-reports/v1/not-public)" = "404"

  xrechnung-standards:
    name: XRechnung 3.0.2 standards validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
      - name: Verify Java runtime
        run: java -version
      - name: Install pinned KoSIT validator and XRechnung configuration
        run: python tools/install_xrechnung_validator.py
      - name: Validate official accepted and rejected fixtures
        env:
          SIMPLEOFFICE_RUN_XRECHNUNG_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p 'test_xrechnung_validator.py' -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Enforce repository secret-leak gate
        run: python tools/check_secret_leaks.py .
      - name: Install project and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[security]"
      - name: Check known dependency vulnerabilities
        run: python -m pip_audit
      - name: Verify CRA security evidence
        run: python tools/cra_check.py
      - name: Generate release SBOM
        run: |
          python tools/generate_sbom.py
          python -m json.tool artifacts/sbom.cdx.json > /dev/null
