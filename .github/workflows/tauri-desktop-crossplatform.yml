name: Tauri 2 Windows and macOS
on:
  pull_request:
    paths:
      - 'desktop/tauri/**'
      - 'tools/prepare_tauri_client.py'
      - 'tools/generate_sbom.py'
      - 'static/css/app.css'
      - 'static/vendor/bootstrap-5.3.8/css/bootstrap.min.css'
      - 'docs/assets/simpleoffice-documentation-logo.png'
      - 'pyproject.toml'
      - '.github/workflows/tauri-desktop-crossplatform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            target: x86_64-pc-windows-msvc
            npm_os: win32
            npm_cpu: x64
            validator: cyclonedx-win-x64.exe
            validator_sha256: 9b360974c41a5d612eb026fb5e3bb1fa28e08865f7a4f915665b8bc94bd3bc31
          - os: macos-15
            name: macos-arm64
            target: aarch64-apple-darwin
            npm_os: darwin
            npm_cpu: arm64
            validator: cyclonedx-osx-arm64
            validator_sha256: 750c148780154833f6401f9067d08c5a4c31567b6ee3c26c062c3a95c62d741c
          - os: macos-15-intel
            name: macos-x64
            target: x86_64-apple-darwin
            npm_os: darwin
            npm_cpu: x64
            validator: cyclonedx-osx-x64
            validator_sha256: 0ea92306fc7d7c30ed112a7463781a200585a3bf1cdaf77229181c5aabd1d4b6
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned SBOM packaging helper
        run: python -m pip install --require-hashes -r ../../requirements-ci-tools.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-29)
      - run: npm ci --no-audit --no-fund
      - name: Generate resolved platform-specific npm inventory
        working-directory: .
        shell: bash
        run: |
          python tools/generate_sbom.py --npm-lock desktop/tauri/package-lock.json \
            --npm-os '${{ matrix.npm_os }}' --npm-cpu '${{ matrix.npm_cpu }}' \
            --output "artifacts/tauri-platform/${{ matrix.name }}-npm.cdx.json" \
            --xml-output "artifacts/tauri-platform/${{ matrix.name }}-npm.cdx.xml"
      - run: npm run prepare:client
      - run: npx tauri icon ../../docs/assets/simpleoffice-documentation-logo.png
      - name: Verify native build architecture
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            aarch64-apple-darwin) test "$(uname -m)" = arm64 ;;
            x86_64-apple-darwin) test "$(uname -m)" = x86_64 ;;
            x86_64-pc-windows-msvc) test "$RUNNER_ARCH" = X64 ;;
            *) exit 1 ;;
          esac
      - run: npm run build -- -- --locked
      - name: Generate resolved platform-specific Rust inventory
        working-directory: .
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' \
            --manifest-path desktop/tauri/src-tauri/Cargo.toml > "$RUNNER_TEMP/tauri-cargo-metadata.json"
          python tools/generate_sbom.py --cargo-metadata "$RUNNER_TEMP/tauri-cargo-metadata.json" \
            --output "artifacts/tauri-platform/${{ matrix.name }}-rust.cdx.json" \
            --xml-output "artifacts/tauri-platform/${{ matrix.name }}-rust.cdx.xml"
      - name: Install pinned CycloneDX CLI and validate the platform inventories
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/${{ matrix.validator }}"
          curl --fail --location --retry 3 \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/${{ matrix.validator }}" \
            --output "$validator"
          python - "$validator" '${{ matrix.validator_sha256 }}' <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          digest = hashlib.sha256()
          with path.open("rb") as source:
              for block in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(block)
          if digest.hexdigest() != sys.argv[2]:
              raise SystemExit(f"CycloneDX CLI checksum mismatch for {path.name}")
          PY
          chmod 0755 "$validator"
          for bom in "artifacts/tauri-platform/${{ matrix.name }}-npm.cdx.json" \
                     "artifacts/tauri-platform/${{ matrix.name }}-rust.cdx.json"; do
            "$validator" validate --input-file "$bom" --input-format json \
              --input-version v1_6 --fail-on-errors
          done
          for bom in "artifacts/tauri-platform/${{ matrix.name }}-npm.cdx.xml" \
                     "artifacts/tauri-platform/${{ matrix.name }}-rust.cdx.xml"; do
            "$validator" validate --input-file "$bom" --input-format xml \
              --input-version v1_6 --fail-on-errors
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-platform-sbom-${{ matrix.name }}
          path: artifacts/tauri-platform/${{ matrix.name }}-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-desktop-${{ matrix.name }}
          path: desktop/tauri/src-tauri/target/release/bundle/
          if-no-files-found: error
