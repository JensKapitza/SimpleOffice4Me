name: Kids local syllable microphone

on:
  pull_request:
    paths:
      - '.github/workflows/kids-syllable-mic.yml'
      - 'app/__init__.py'
      - 'static/js/kids_syllable*.js'
      - 'static/css/kids_syllables.css'
      - 'templates/kids/*syllab*.html'
      - 'tests/*kids_syllable*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: kids-syllable-mic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-webaudio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install existing app and browser test dependencies
        run: |
          python -m pip install --editable '.[web-export,test]'
          python -m playwright install --with-deps chromium
      - name: Verify authenticated Kids input with generated Web Audio, no devices
        env:
          PYTHONPATH: .:tests
        run: |
          node --test tests/kids_syllable_mic.test.cjs
          python -m unittest -v tests.test_kids_syllable_mic tests.test_kids_syllable_mic_browser
