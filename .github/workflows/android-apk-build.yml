name: Android APK build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Public endpoint only; never put the GitHub token into an Android build.
  SIMPLEOFFICE_ERROR_REPORT_URL: ${{ vars.SIMPLEOFFICE_ERROR_REPORT_URL }}

jobs:
  apk:
    name: APK ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ARM64
            abi: arm64-v8a
            python: '3.13'
            output: SimpleOffice4Me-Android-arm64.apk
            artifact: simpleoffice4me-android-installable
            page-size: '16'
          - label: ARM32
            abi: armeabi-v7a
            python: '3.11'
            output: SimpleOffice4Me-Android-arm32.apk
            artifact: simpleoffice4me-android-arm32-installable
            page-size: '4'
    env:
      SIMPLEOFFICE_ANDROID_ABI: ${{ matrix.abi }}
      SIMPLEOFFICE_ANDROID_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set deterministic APK version identity
        shell: bash
        run: |
          echo "SIMPLEOFFICE_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "SIMPLEOFFICE_BUILD_SEQUENCE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build installable Android APK
        working-directory: android/apk
        run: gradle --no-daemon assembleDebug

      - name: Verify bundled Python runtime assets and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/app/__init__.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/simpleoffice_version.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/pyproject.toml' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/tools/launcher.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/' /tmp/apk-files.txt
          grep -F "lib/${{ matrix.abi }}/" /tmp/apk-files.txt
          if grep -E 'lib/(arm64-v8a|armeabi-v7a)/' /tmp/apk-files.txt | grep -Fv "lib/${{ matrix.abi }}/"; then
            echo "APK contains native libraries for an unexpected ABI" >&2
            exit 1
          fi

      - name: Verify APK package date version and Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" && test -x "$AAPT"
          PROJECT_MAJOR="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(project['project']['version'].split('.')[0])
          PY
          )"
          EXPECTED_VERSION="${PROJECT_MAJOR}.${SIMPLEOFFICE_BUILD_DATE}.${SIMPLEOFFICE_BUILD_SEQUENCE}"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          case "$BADGING" in
            *"versionName='$EXPECTED_VERSION'"*) ;;
            *) echo "APK version does not match $EXPECTED_VERSION: $BADGING" >&2; exit 1 ;;
          esac
          EXPECTED_CODE="$(python - <<'PY'
          import datetime as dt
          import os
          day = dt.datetime.strptime(os.environ['SIMPLEOFFICE_BUILD_DATE'], '%Y%m%d').date()
          sequence = int(os.environ['SIMPLEOFFICE_BUILD_SEQUENCE'])
          print((day - dt.date(2020, 1, 1)).days * 10000 + sequence)
          PY
          )"
          case "$BADGING" in
            *"versionCode='$EXPECTED_CODE'"*) ;;
            *) echo "APK versionCode does not match $EXPECTED_CODE: $BADGING" >&2; exit 1 ;;
          esac

      - name: Verify packaged launcher images
        run: |
          python -m pip install 'Pillow==11.0.0'
          python tools/check_android_launcher_assets.py android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and native-library alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$ZIPALIGN" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P '${{ matrix.page-size }}' -v 4 "$APK"
          mkdir -p artifacts/android
          VERSIONED_OUTPUT="${{ matrix.output }}"
          VERSIONED_OUTPUT="${VERSIONED_OUTPUT%.apk}-${SIMPLEOFFICE_BUILD_DATE}-${SIMPLEOFFICE_BUILD_SEQUENCE}.apk"
          cp "$APK" "artifacts/android/${VERSIONED_OUTPUT}"
          sha256sum "artifacts/android/${VERSIONED_OUTPUT}" > "artifacts/android/${VERSIONED_OUTPUT}.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14
