name: Android APK build

on:
  workflow_dispatch:
    inputs:
      build_arm32:
        description: 'Also build legacy ARM32 APK (Python 3.11)'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'android/apk/**'
      - 'tools/android_apk_python_sbom.py'
      - 'tools/generate_sbom.py'
      - 'tests/test_android_apk_python_sbom.py'
      - 'tests/test_android_build_profiles.py'
      - '.github/workflows/android-apk-build.yml'
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Public endpoint only; never put the GitHub token into an Android build.
  SIMPLEOFFICE_ERROR_REPORT_URL: ${{ vars.SIMPLEOFFICE_ERROR_REPORT_URL }}

jobs:
  apk:
    name: APK ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.build_arm32) && '[{"label":"ARM64","abi":"arm64-v8a","python":"3.15","output":"SimpleOffice4Me-Android-arm64.apk","artifact":"simpleoffice4me-android-installable","page-size":"16"},{"label":"ARM32","abi":"armeabi-v7a","python":"3.11","output":"SimpleOffice4Me-Android-arm32.apk","artifact":"simpleoffice4me-android-arm32-installable","page-size":"4"}]' || '[{"label":"ARM64","abi":"arm64-v8a","python":"3.15","output":"SimpleOffice4Me-Android-arm64.apk","artifact":"simpleoffice4me-android-installable","page-size":"16"}]') }}
    env:
      SIMPLEOFFICE_ANDROID_ABI: ${{ matrix.abi }}
      SIMPLEOFFICE_ANDROID_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build installable Android APK
        working-directory: android/apk
        run: gradle --no-daemon assembleDebug

      - name: Verify bundled Python runtime assets and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/app/__init__.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/simpleoffice_version.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/pyproject.toml' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/tools/launcher.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/' /tmp/apk-files.txt
          grep -F "lib/${{ matrix.abi }}/" /tmp/apk-files.txt
          if grep -E 'lib/(arm64-v8a|armeabi-v7a)/' /tmp/apk-files.txt | grep -Fv "lib/${{ matrix.abi }}/"; then
            echo "APK contains native libraries for an unexpected ABI" >&2
            exit 1
          fi

      - name: Verify APK package version matches project version
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" && test -x "$AAPT"
          PROJECT_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'(?ms)^\[project\]\s.*?^version\s*=\s*["\x27]([^"\x27]+)["\x27]', text)
          if not match:
              raise SystemExit('project version missing')
          print(match.group(1))
          PY
          )"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          case "$BADGING" in
            *"versionName='$PROJECT_VERSION'"*) ;;
            *) echo "APK version does not match project version $PROJECT_VERSION: $BADGING" >&2; exit 1 ;;
          esac

      - name: Verify packaged launcher images
        run: |
          python -m pip install 'Pillow==12.2.0'
          python tools/check_android_launcher_assets.py android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and native-library alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$ZIPALIGN" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P '${{ matrix.page-size }}' -v 4 "$APK"
          mkdir -p artifacts/android
          cp "$APK" "artifacts/android/${{ matrix.output }}"
          sha256sum "artifacts/android/${{ matrix.output }}" > "artifacts/android/${{ matrix.output }}.sha256"

      - name: Generate resolved Android JVM dependency SBOM
        working-directory: android/apk
        run: gradle --no-daemon :app:exportResolvedAndroidDependencies

      - name: Convert Android JVM inventory to CycloneDX XML and JSON
        run: |
          python -m pip install 'packaging>=24,<27'
          python -m unittest discover -s tests -p test_android_apk_python_sbom.py
          python -m unittest discover -s tests -p test_android_build_profiles.py
          python tools/generate_sbom.py \
            --gradle-resolution android/apk/app/build/reports/sbom/gradle-runtime.json \
            --output artifacts/android/gradle-runtime.cdx.json \
            --xml-output artifacts/android/gradle-runtime.cdx.xml
          python -m json.tool artifacts/android/gradle-runtime.cdx.json > /dev/null

      - name: Inventory APK Python wheels and enforce Pillow security baseline
        run: |
          python tools/android_apk_python_sbom.py \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --output artifacts/android/chaquopy-python.cdx.json \
            --xml-output artifacts/android/chaquopy-python.cdx.xml \
            --enforce-pillow-baseline

      - name: Install pinned CycloneDX CLI validator
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          for bom in artifacts/android/gradle-runtime.cdx.json artifacts/android/chaquopy-python.cdx.json; do
            "$validator" validate --input-file "$bom" --input-format json \
              --input-version v1_6 --fail-on-errors
          done
          for bom in artifacts/android/gradle-runtime.cdx.xml artifacts/android/chaquopy-python.cdx.xml; do
            "$validator" validate --input-file "$bom" --input-format xml \
              --input-version v1_6 --fail-on-errors
          done

      - name: Upload APK-bundled Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: android-python-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/chaquopy-python.cdx.json
            artifacts/android/chaquopy-python.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved Android JVM SBOM
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/gradle-runtime.cdx.json
            artifacts/android/gradle-runtime.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14
