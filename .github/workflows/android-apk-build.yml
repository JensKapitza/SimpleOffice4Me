name: Android APK build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/apk/**'
      - 'tools/run_android_contacts_provider_acceptance.sh'
      # This shared setup runs inside the APK WebView as well as on the server.
      - 'app/optional_local_setup.py'
      - 'app/optional_setup_routes.py'
      - 'app/sms_archive_routes.py'
      - 'app/sms_archive_store.py'
      - 'templates/sms_archive/**'
      - 'tools/android_sms_download_acceptance.py'
      - 'tools/run_android_sms_download_acceptance.sh'
      - 'tools/*android_sms_device_import_acceptance*'
      - 'static/js/android_sms_device_import.js'
      - 'static/js/optional-setup-progress.js'
      - 'templates/optional_setup/**'
      # Inventory runs in the bundled WebView, including browser-only NFC changes.
      - 'app/inventory.py'
      - 'static/js/inventory*.js'
      - 'templates/inventory/**'
      - 'tools/*android_nfc_fallback_acceptance*'
      - 'requirements-ci-browser.txt'
      - 'licenses/MEDIAPIPE-APACHE-2.0.txt'
      - 'requirements-ci-tools.txt'
      - 'requirements-ci-android-apk.in'
      - 'requirements-ci-android-apk.txt'
      - 'requirements-ci-android-wheels.in'
      - 'requirements-ci-android-wheels.txt'
      - 'tools/android_apk_python_sbom.py'
      - 'tools/android_elf_diagnostics.py'
      - 'tools/check_chaquopy_wheels.py'
      - 'tools/check_gradle_sbom.py'
      - 'tools/generate_sbom.py'
      - 'tests/test_android_apk_python_sbom.py'
      - 'tests/test_android_build_profiles.py'
      - 'tests/test_gradle_sbom.py'
      - 'tests/test_chaquopy_wheels.py'
      - 'tests/test_android_apk_build_matrix.py'
      - 'tests/test_android_elf_diagnostics.py'
      - 'tests/test_android_native_integration.py'
      - 'pyproject.toml'
      - 'simpleoffice_version.py'
      - '.github/workflows/android-apk-build.yml'
      - '.github/workflows/android-native-wheels.yml'
  push:
    branches:
      - main
      - hackathon/contextflow-mvp

# Superseded PR revisions should not occupy Android build runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Public endpoint only; never put the GitHub token into an Android build.
  SIMPLEOFFICE_ERROR_REPORT_URL: ${{ vars.SIMPLEOFFICE_ERROR_REPORT_URL }}

jobs:
  native-wheels:
    uses: ./.github/workflows/android-native-wheels.yml

  apk:
    name: APK ${{ matrix.label }}
    needs: native-wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ARM64
            abi: arm64-v8a
            python: '3.14'
            output: SimpleOffice4Me-Android-arm64.apk
            artifact: simpleoffice4me-android-installable
            page-size: '16'
    env:
      SIMPLEOFFICE_ANDROID_ABI: ${{ matrix.abi }}
      SIMPLEOFFICE_ANDROID_PYTHON: ${{ matrix.python }}
      SIMPLEOFFICE_ANDROID_WHEEL_DIR: ${{ github.workspace }}/android/apk/app/wheelhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp314-arm64-Pillow-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp314-arm64-cryptography-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp314-arm64-cffi-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-cp314-arm64-argon2-cffi-bindings-wheel
          path: android/apk/app/wheelhouse

      - name: Verify local Android wheel hashes
        shell: bash
        run: |
          cd android/apk/app/wheelhouse
          sha256sum --check Pillow-SHA256SUMS cryptography-SHA256SUMS cffi-SHA256SUMS argon2-cffi-bindings-SHA256SUMS

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Test Android wheel compatibility checker
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt
          python -m unittest discover -s tests -p test_chaquopy_wheels.py

      - name: Preflight native Chaquopy wheel availability
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt
          python tools/check_chaquopy_wheels.py \
            --python "${{ matrix.python }}" \
            --abi "${{ matrix.abi }}" \
            --wheel-dir android/apk/app/wheelhouse

      - name: Set deterministic APK version identity
        shell: bash
        run: |
          echo "SIMPLEOFFICE_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "SIMPLEOFFICE_BUILD_SEQUENCE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Create ephemeral key for release-signing smoke
        id: release-smoke
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/android-release-smoke"
          key_store="$key_dir/release-smoke.jks"
          mkdir -p "$key_dir"
          store_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          key_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$key_store" -storepass "$store_password" \
            -keypass "$key_password" -alias release-smoke \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=SimpleOffice4Me CI Release Smoke'
          {
            echo "keystore=$key_store"
            echo "store_password=$store_password"
            echo "key_alias=release-smoke"
            echo "key_password=$key_password"
          } >> "$GITHUB_OUTPUT"

      - name: Build debug APK and ephemeral signed release smoke APK
        working-directory: android/apk
        env:
          SIMPLEOFFICE_RELEASE_KEYSTORE: ${{ steps.release-smoke.outputs.keystore }}
          SIMPLEOFFICE_RELEASE_KEYSTORE_PASSWORD: ${{ steps.release-smoke.outputs.store_password }}
          SIMPLEOFFICE_RELEASE_KEY_ALIAS: ${{ steps.release-smoke.outputs.key_alias }}
          SIMPLEOFFICE_RELEASE_KEY_PASSWORD: ${{ steps.release-smoke.outputs.key_password }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Verify resolved release signature scheme flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          build = Path("android/apk/app/build")
          files = sorted(
              path for path in build.rglob("signing-config-versions.json")
              if "release" in str(path).lower()
          )
          if len(files) != 1:
              raise SystemExit(
                  f"Expected one AGP release signing-version record; found {len(files)}"
              )
          resolved = json.loads(files[0].read_text(encoding="utf-8"))
          v1 = resolved.get("enableV1Signing")
          v2 = resolved.get("enableV2Signing")
          print(f"AGP resolved release signature schemes: v1={v1}, v2={v2}")
          if v1 is not True or v2 is not True:
              raise SystemExit("AGP did not resolve both required release signature schemes")
          PY

      - name: Verify ordinary APK does not request Android SMS access
        shell: bash
        run: |
          set -euo pipefail
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump permissions android/apk/app/build/outputs/apk/debug/app-debug.apk > /tmp/ordinary-apk-permissions.txt
          if grep -F 'android.permission.READ_SMS' /tmp/ordinary-apk-permissions.txt; then
            echo 'Ordinary APK must not request READ_SMS' >&2
            exit 1
          fi

      - name: Verify bundled Python runtime assets and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/app/__init__.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/simpleoffice_version.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/pyproject.toml' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/tools/launcher.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/inventory/intake.html' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/js/inventory_intake_native_scan.js' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/js/inventory_nfc.js' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/inventory/index.html' /tmp/apk-files.txt
          HAND_LICENSE='licenses/MEDIAPIPE-APACHE-2.0.txt'
          unzip -p "$APK" "assets/simpleoffice/$HAND_LICENSE" | cmp - "$HAND_LICENSE"
          grep -F "lib/${{ matrix.abi }}/" /tmp/apk-files.txt
          if grep -E 'lib/(arm64-v8a|armeabi-v7a)/' /tmp/apk-files.txt | grep -Fv "lib/${{ matrix.abi }}/"; then
            echo "APK contains native libraries for an unexpected ABI" >&2
            exit 1
          fi

      - name: Verify APK package date version and Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" && test -x "$AAPT"
          PROJECT_MAJOR="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(project['project']['version'].split('.')[0])
          PY
          )"
          EXPECTED_VERSION="${PROJECT_MAJOR}.${SIMPLEOFFICE_BUILD_DATE}.${SIMPLEOFFICE_BUILD_SEQUENCE}"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          case "$BADGING" in
            *"versionName='$EXPECTED_VERSION'"*) ;;
            *) echo "APK version does not match $EXPECTED_VERSION: $BADGING" >&2; exit 1 ;;
          esac
          EXPECTED_CODE="$(python - <<'PY'
          import datetime as dt
          import os
          day = dt.datetime.strptime(os.environ['SIMPLEOFFICE_BUILD_DATE'], '%Y%m%d').date()
          sequence = int(os.environ['SIMPLEOFFICE_BUILD_SEQUENCE'])
          print((day - dt.date(2020, 1, 1)).days * 10000 + sequence)
          PY
          )"
          case "$BADGING" in
            *"versionCode='$EXPECTED_CODE'"*) ;;
            *) echo "APK versionCode does not match $EXPECTED_CODE: $BADGING" >&2; exit 1 ;;
          esac

      - name: Verify packaged launcher images
        run: |
          python -m pip install --require-hashes -r requirements-ci-android-apk.txt
          python tools/check_android_launcher_assets.py android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and native-library alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$ZIPALIGN" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P '${{ matrix.page-size }}' -v 4 "$APK"
          mkdir -p artifacts/android
          VERSIONED_OUTPUT="${{ matrix.output }}"
          VERSIONED_OUTPUT="${VERSIONED_OUTPUT%.apk}-${SIMPLEOFFICE_BUILD_DATE}-${SIMPLEOFFICE_BUILD_SEQUENCE}.apk"
          cp "$APK" "artifacts/android/${VERSIONED_OUTPUT}"
          sha256sum "artifacts/android/${VERSIONED_OUTPUT}" > "artifacts/android/${VERSIONED_OUTPUT}.sha256"

      - name: Verify ephemeral signed release smoke APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee /tmp/release-apksigner.txt
          grep -F 'Verified using v1 scheme (JAR signing): true' /tmp/release-apksigner.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/release-apksigner.txt
          grep -F 'lib/arm64-v8a/' <(unzip -l "$APK")

      - name: Remove ephemeral release signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/android-release-smoke"

      - name: Generate CycloneDX SBOM from resolved Android JVM dependencies
        working-directory: android/apk
        run: gradle --no-daemon :app:cyclonedxDirectBom

      - name: Collect Android JVM SBOM and run inventory regressions
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt
          python -m unittest discover -s tests -p test_android_build_profiles.py
          python -m unittest tests.test_gradle_sbom -v
          mkdir -p artifacts/android
          cp android/apk/app/build/reports/sbom/gradle-runtime.cdx.json artifacts/android/gradle-runtime.cdx.json
          cp android/apk/app/build/reports/sbom/gradle-runtime.cdx.xml artifacts/android/gradle-runtime.cdx.xml
          python -m json.tool artifacts/android/gradle-runtime.cdx.json > /dev/null
          python tools/check_gradle_sbom.py artifacts/android/gradle-runtime.cdx.json

      - name: Diagnose cryptography Android ELF symbol linkage
        run: |
          python tools/android_elf_diagnostics.py \
            --apk android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --output artifacts/android/elf-diagnostics \
            --require-python-dependency

      - name: Upload Android ELF linkage diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-elf-linkage-${{ matrix.abi }}
          path: artifacts/android/elf-diagnostics/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Android runtime smoke gate (packaged contract, no emulator)
        run: |
          python tools/android_emulator_smoke.py \
            --apk android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --output artifacts/android/runtime-smoke

      - name: Upload Android runtime smoke report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-runtime-smoke-${{ matrix.abi }}
          path: artifacts/android/runtime-smoke/*
          if-no-files-found: error
          retention-days: 14

      - name: Inventory APK Python wheels
        run: |
          python tools/android_apk_python_sbom.py \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --gradle android/apk/app/build.gradle \
            --output artifacts/android/chaquopy-python.cdx.json \
            --xml-output artifacts/android/chaquopy-python.cdx.xml

      - name: Install pinned CycloneDX CLI validator
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          for bom in artifacts/android/gradle-runtime.cdx.json artifacts/android/chaquopy-python.cdx.json; do
            "$validator" validate --input-file "$bom" --input-format json \
              --input-version v1_6 --fail-on-errors
          done
          for bom in artifacts/android/gradle-runtime.cdx.xml artifacts/android/chaquopy-python.cdx.xml; do
            "$validator" validate --input-file "$bom" --input-format xml \
              --input-version v1_6 --fail-on-errors
          done

      - name: Upload APK-bundled Python SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-python-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/chaquopy-python.cdx.json
            artifacts/android/chaquopy-python.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved Android JVM SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-gradle-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/gradle-runtime.cdx.json
            artifacts/android/gradle-runtime.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Android Pillow security baseline
        run: |
          python tools/android_apk_python_sbom.py \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --gradle android/apk/app/build.gradle \
            --output artifacts/android/chaquopy-python.cdx.json \
            --xml-output artifacts/android/chaquopy-python.cdx.xml \
            --enforce-pillow-baseline

      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

      - name: Check whether NFC fallback acceptance is affected
        id: nfc-fallback
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            'app/inventory.py' 'static/js/inventory_nfc.js' 'templates/inventory/**' \
            'tools/*android_nfc_fallback_acceptance*' \
            'android/apk/app/src/main/java/de/simpleoffice4me/android/MainActivity.java' \
            '.github/workflows/android-apk-build.yml' 'requirements-ci-browser.txt')"
          if [[ -n "$changed" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.nfc-fallback.outputs.needed == 'true'
        with:
          python-version: '3.12'

      - name: Android inventory NFC fallback on real WebView
        if: steps.nfc-fallback.outputs.needed == 'true'
        timeout-minutes: 18
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt -r requirements-ci-browser.txt
          bash tools/run_android_nfc_fallback_acceptance.sh \
            android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Check whether Android SMS backup acceptance is affected
        id: sms-backup-acceptance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            'android/apk/app/src/main/java/de/simpleoffice4me/android/AndroidDownloadHandler.java' \
            'app/sms_archive_routes.py' 'app/sms_archive_store.py' 'templates/sms_archive/**' \
            '.github/workflows/android-apk-build.yml' 'tools/*android_sms_download_acceptance*')"
          if [[ -n "$changed" ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.sms-backup-acceptance.outputs.needed == 'true'
        with:
          python-version: '3.12'

      - name: Verify real WebView SMS backup and recovery through Android system pickers
        if: steps.sms-backup-acceptance.outputs.needed == 'true'
        timeout-minutes: 22
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-ci-tools.txt -r requirements-ci-browser.txt
          bash tools/run_android_sms_download_acceptance.sh \
            android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Check whether the Android contacts acceptance is affected
        id: contacts-acceptance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            'android/apk/app/src/main/java/de/simpleoffice4me/android/AndroidManaged*.java' \
            'android/apk/app/src/androidTest/**' 'android/apk/app/build.gradle' \
            '.github/workflows/android-apk-build.yml' 'tools/run_android_contacts_provider_acceptance.sh')"
          if [[ -n "$changed" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Build isolated contacts instrumentation APK
        if: steps.contacts-acceptance.outputs.needed == 'true'
        working-directory: android/apk
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Android contacts and calendar providers on disposable emulator
        if: steps.contacts-acceptance.outputs.needed == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          bash tools/run_android_contacts_provider_acceptance.sh \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            android/apk/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Check whether direct Android SMS import is affected
        id: device-sms
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            'android/apk/app/src/deviceSms/**' 'android/apk/app/src/main/java/**/AndroidSms*' \
            'android/apk/app/src/main/python/android_runtime.py' 'android/apk/app/build.gradle' \
            'app/sms_archive_*.py' 'static/js/android_sms_device_import.js' \
            'templates/sms_archive/**' '.github/workflows/android-apk-build.yml' \
            'tools/*android_sms_device_import_acceptance*')"
          if [[ -n "$changed" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Build optional SMS APK for the isolated emulator
        if: steps.device-sms.outputs.needed == 'true'
        working-directory: android/apk
        env:
          SIMPLEOFFICE_ANDROID_DEVICE_SMS: '1'
        run: gradle --no-daemon assembleDebug

      - name: Direct Android SMS import on disposable emulator
        if: steps.device-sms.outputs.needed == 'true'
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          apk=android/apk/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump permissions "$apk" > /tmp/opt-in-apk-permissions.txt
          grep -F 'android.permission.READ_SMS' /tmp/opt-in-apk-permissions.txt
          if grep -E 'android\.permission\.(WRITE_SMS|SEND_SMS|RECEIVE_SMS|RECEIVE_MMS)' /tmp/opt-in-apk-permissions.txt; then
            echo 'The optional APK must not request SMS send, receive or write access' >&2
            exit 1
          fi
          python -m pip install --require-hashes -r requirements-ci-tools.txt -r requirements-ci-browser.txt
          bash tools/run_android_sms_device_import_acceptance.sh "$apk"
