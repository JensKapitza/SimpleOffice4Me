name: Android APK build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/apk/**'
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android-apk-build.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android APK
        working-directory: android/apk
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simpleoffice4me-android-apk
          path: |
            android/apk/app/build/outputs/apk/debug/*.apk
            android/apk/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
