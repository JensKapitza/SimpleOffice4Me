name: Android APK build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/apk/**'
      - 'tools/android_apk_python_sbom.py'
      - 'tools/android_elf_diagnostics.py'
      - 'tools/check_chaquopy_wheels.py'
      - 'tools/check_gradle_sbom.py'
      - 'tools/generate_sbom.py'
      - 'tests/test_android_apk_python_sbom.py'
      - 'tests/test_android_build_profiles.py'
      - 'tests/test_gradle_sbom.py'
      - 'tests/test_chaquopy_wheels.py'
      - 'tests/test_android_apk_build_matrix.py'
      - 'tests/test_android_elf_diagnostics.py'
      - 'tests/test_android_native_integration.py'
      - 'pyproject.toml'
      - 'simpleoffice_version.py'
      - '.github/workflows/android-apk-build.yml'
      - '.github/workflows/android-native-wheels.yml'
  push:
    branches:
      - main

# Superseded PR revisions should not occupy Android build runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Public endpoint only; never put the GitHub token into an Android build.
  SIMPLEOFFICE_ERROR_REPORT_URL: ${{ vars.SIMPLEOFFICE_ERROR_REPORT_URL }}

jobs:
  native-wheels:
    uses: ./.github/workflows/android-native-wheels.yml

  apk:
    name: APK ${{ matrix.label }}
    needs: native-wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ARM64
            abi: arm64-v8a
            python: '3.15'
            output: SimpleOffice4Me-Android-arm64.apk
            artifact: simpleoffice4me-android-installable
            page-size: '16'
    env:
      SIMPLEOFFICE_ANDROID_ABI: ${{ matrix.abi }}
      SIMPLEOFFICE_ANDROID_PYTHON: ${{ matrix.python }}
      SIMPLEOFFICE_ANDROID_WHEEL_DIR: ${{ github.workspace }}/android/apk/app/wheelhouse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v7
        with:
          name: android-cp315-arm64-Pillow-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@v7
        with:
          name: android-cp315-arm64-cryptography-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@v7
        with:
          name: android-cp315-arm64-cffi-wheel
          path: android/apk/app/wheelhouse

      - uses: actions/download-artifact@v7
        with:
          name: android-cp315-arm64-argon2-cffi-bindings-wheel
          path: android/apk/app/wheelhouse

      - name: Verify local Android wheel hashes
        shell: bash
        run: |
          cd android/apk/app/wheelhouse
          sha256sum --check Pillow-SHA256SUMS cryptography-SHA256SUMS cffi-SHA256SUMS argon2-cffi-bindings-SHA256SUMS

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Test Android wheel compatibility checker
        run: |
          python -m pip install 'packaging==26.3'
          python -m unittest discover -s tests -p test_chaquopy_wheels.py

      - name: Preflight native Chaquopy wheel availability
        run: |
          python -m pip install 'packaging==26.3'
          python tools/check_chaquopy_wheels.py \
            --python "${{ matrix.python }}" \
            --abi "${{ matrix.abi }}" \
            --wheel-dir android/apk/app/wheelhouse

      - name: Set deterministic APK version identity
        shell: bash
        run: |
          echo "SIMPLEOFFICE_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "SIMPLEOFFICE_BUILD_SEQUENCE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build installable Android APK
        working-directory: android/apk
        run: gradle --no-daemon assembleDebug

      - name: Verify bundled Python runtime assets and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/app/__init__.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/simpleoffice_version.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/pyproject.toml' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/tools/launcher.py' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/templates/' /tmp/apk-files.txt
          grep -F 'assets/simpleoffice/static/' /tmp/apk-files.txt
          grep -F "lib/${{ matrix.abi }}/" /tmp/apk-files.txt
          if grep -E 'lib/(arm64-v8a|armeabi-v7a)/' /tmp/apk-files.txt | grep -Fv "lib/${{ matrix.abi }}/"; then
            echo "APK contains native libraries for an unexpected ABI" >&2
            exit 1
          fi

      - name: Verify APK package date version and Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" && test -x "$AAPT"
          PROJECT_MAJOR="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(project['project']['version'].split('.')[0])
          PY
          )"
          EXPECTED_VERSION="${PROJECT_MAJOR}.${SIMPLEOFFICE_BUILD_DATE}.${SIMPLEOFFICE_BUILD_SEQUENCE}"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          case "$BADGING" in
            *"versionName='$EXPECTED_VERSION'"*) ;;
            *) echo "APK version does not match $EXPECTED_VERSION: $BADGING" >&2; exit 1 ;;
          esac
          EXPECTED_CODE="$(python - <<'PY'
          import datetime as dt
          import os
          day = dt.datetime.strptime(os.environ['SIMPLEOFFICE_BUILD_DATE'], '%Y%m%d').date()
          sequence = int(os.environ['SIMPLEOFFICE_BUILD_SEQUENCE'])
          print((day - dt.date(2020, 1, 1)).days * 10000 + sequence)
          PY
          )"
          case "$BADGING" in
            *"versionCode='$EXPECTED_CODE'"*) ;;
            *) echo "APK versionCode does not match $EXPECTED_CODE: $BADGING" >&2; exit 1 ;;
          esac

      - name: Verify packaged launcher images
        run: |
          python -m pip install 'Pillow==13.0.0'
          python tools/check_android_launcher_assets.py android/apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and native-library alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$ZIPALIGN" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P '${{ matrix.page-size }}' -v 4 "$APK"
          mkdir -p artifacts/android
          VERSIONED_OUTPUT="${{ matrix.output }}"
          VERSIONED_OUTPUT="${VERSIONED_OUTPUT%.apk}-${SIMPLEOFFICE_BUILD_DATE}-${SIMPLEOFFICE_BUILD_SEQUENCE}.apk"
          cp "$APK" "artifacts/android/${VERSIONED_OUTPUT}"
          sha256sum "artifacts/android/${VERSIONED_OUTPUT}" > "artifacts/android/${VERSIONED_OUTPUT}.sha256"

      - name: Generate CycloneDX SBOM from resolved Android JVM dependencies
        working-directory: android/apk
        run: gradle --no-daemon :app:cyclonedxDirectBom

      - name: Collect Android JVM SBOM and run inventory regressions
        run: |
          python -m pip install 'packaging==26.3'
          python -m unittest discover -s tests -p test_android_build_profiles.py
          python -m unittest tests.test_gradle_sbom -v
          mkdir -p artifacts/android
          cp android/apk/app/build/reports/sbom/gradle-runtime.cdx.json artifacts/android/gradle-runtime.cdx.json
          cp android/apk/app/build/reports/sbom/gradle-runtime.cdx.xml artifacts/android/gradle-runtime.cdx.xml
          python -m json.tool artifacts/android/gradle-runtime.cdx.json > /dev/null
          python tools/check_gradle_sbom.py artifacts/android/gradle-runtime.cdx.json

      - name: Diagnose cryptography Android ELF symbol linkage
        run: |
          python tools/android_elf_diagnostics.py \
            --apk android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --output artifacts/android/elf-diagnostics \
            --require-python-dependency

      - name: Upload Android ELF linkage diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: android-elf-linkage-${{ matrix.abi }}
          path: artifacts/android/elf-diagnostics/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Inventory APK Python wheels
        run: |
          python tools/android_apk_python_sbom.py \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --gradle android/apk/app/build.gradle \
            --output artifacts/android/chaquopy-python.cdx.json \
            --xml-output artifacts/android/chaquopy-python.cdx.xml

      - name: Install pinned CycloneDX CLI validator
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/cyclonedx"
          curl --fail --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "$validator"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$validator" | sha256sum --check --status
          chmod 0755 "$validator"
          for bom in artifacts/android/gradle-runtime.cdx.json artifacts/android/chaquopy-python.cdx.json; do
            "$validator" validate --input-file "$bom" --input-format json \
              --input-version v1_6 --fail-on-errors
          done
          for bom in artifacts/android/gradle-runtime.cdx.xml artifacts/android/chaquopy-python.cdx.xml; do
            "$validator" validate --input-file "$bom" --input-format xml \
              --input-version v1_6 --fail-on-errors
          done

      - name: Upload APK-bundled Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: android-python-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/chaquopy-python.cdx.json
            artifacts/android/chaquopy-python.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved Android JVM SBOM
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-sbom-${{ matrix.abi }}
          path: |
            artifacts/android/gradle-runtime.cdx.json
            artifacts/android/gradle-runtime.cdx.xml
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Android Pillow security baseline
        run: |
          python tools/android_apk_python_sbom.py \
            android/apk/app/build/outputs/apk/debug/app-debug.apk \
            --gradle android/apk/app/build.gradle \
            --output artifacts/android/chaquopy-python.cdx.json \
            --xml-output artifacts/android/chaquopy-python.cdx.xml \
            --enforce-pillow-baseline

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14
