name: Android APK build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/apk/**'
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android-apk-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Select Chaquopy build interpreter
        shell: bash
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build installable Android APK
        working-directory: android/apk
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='android/apk/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$ZIPALIGN" && test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          mkdir -p artifacts/android
          cp "$APK" artifacts/android/SimpleOffice4Me-Android-arm64.apk
          sha256sum artifacts/android/SimpleOffice4Me-Android-arm64.apk > artifacts/android/SimpleOffice4Me-Android-arm64.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: simpleoffice4me-android-installable
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14
