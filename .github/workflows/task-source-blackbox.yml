name: Task source document black-box

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "app/todo_store.py"
      - "app/document_store.py"
      - "app/task_management.py"
      - "app/documents_routes_task_source.py"
      - "app/caldav.py"
      - "app/documents.py"
      - "app/documents_routes_content.py"
      - "app/documents_routes_workflows.py"
      - "templates/documents/_task_card.html"
      - "templates/documents/tasks.html"
      - "templates/documents/detail.html"
      - "templates/tasks/board.html"
      - "tests/test_task_source_document_blackbox.py"
      - "tests/test_todo_store.py"
      - "tests/test_caldav.py"
      - "tests/test_task_management.py"
      - ".github/workflows/task-source-blackbox.yml"
  push:
    branches: [main]
    paths:
      - "app/todo_store.py"
      - "app/document_store.py"
      - "app/task_management.py"
      - "app/documents_routes_task_source.py"
      - "app/caldav.py"
      - "app/documents.py"
      - "app/documents_routes_content.py"
      - "app/documents_routes_workflows.py"
      - "templates/documents/_task_card.html"
      - "templates/documents/tasks.html"
      - "templates/documents/detail.html"
      - "templates/tasks/board.html"
      - "tests/test_task_source_document_blackbox.py"
      - "tests/test_todo_store.py"
      - "tests/test_caldav.py"
      - "tests/test_task_management.py"
      - ".github/workflows/task-source-blackbox.yml"
  workflow_dispatch:

jobs:
  blackbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install application
        run: python -m pip install -e .
      - name: Run task source document HTTP black-box tests
        run: python -m unittest discover -s tests -p 'test_task_source_document_blackbox.py' -v
      - name: Run task provenance store regression tests
        run: python -m unittest discover -s tests -p 'test_todo_store.py' -v
