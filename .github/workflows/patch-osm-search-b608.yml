name: Patch OSM search B608

on:
  push:
    branches: [security/quick-wins-round4]
    paths: [.github/workflows/patch-osm-search-b608.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace dynamic OSM address search SQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/osm_address.py')
          source = path.read_text(encoding='utf-8')
          old = '''        def select(db: sqlite3.Connection, selected: list[str]) -> list[sqlite3.Row]:
            where = " AND ".join("normalized LIKE ?" for _ in selected)
            params: list[Any] = [f"%{token}%" for token in selected]
            if country:
                where += " AND country = ?"
                params.append(country)
            params.append(maximum)
            return db.execute(
                f"SELECT * FROM address WHERE {where} ORDER BY CASE WHEN postal <> '' THEN 0 ELSE 1 END, city COLLATE NOCASE, street COLLATE NOCASE, house_number LIMIT ?",
                params,
            ).fetchall()
'''
          new = '''        def select(db: sqlite3.Connection, selected: list[str]) -> list[sqlite3.Row]:
            token_patterns = [f"%{token}%" for token in selected[:8]]
            token_patterns.extend([""] * (8 - len(token_patterns)))
            params: list[Any] = []
            for pattern in token_patterns:
                params.extend((pattern, pattern))
            params.extend((country, country, maximum))
            return db.execute(
                """SELECT * FROM address
                   WHERE (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR normalized LIKE ?)
                     AND (? = '' OR country = ?)
                   ORDER BY CASE WHEN postal <> '' THEN 0 ELSE 1 END,
                            city COLLATE NOCASE,
                            street COLLATE NOCASE,
                            house_number
                   LIMIT ?""",
                params,
            ).fetchall()
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one OSM search SQL block, found {count}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile app/osm_address.py
      - name: Verify reported B608 is gone
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check bandit
          bandit app/osm_address.py -f json -o /tmp/bandit.json || true
          python - <<'PY'
          import json
          data = json.load(open('/tmp/bandit.json', encoding='utf-8'))
          findings = [
              item for item in data.get('results', [])
              if item.get('test_id') == 'B608' and item.get('line_number', 0) >= 1100
          ]
          if findings:
              raise SystemExit(f'remaining search-area B608 findings: {findings}')
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-osm-search-b608.yml
          git add app/osm_address.py
          git commit -m "Use static OSM address search query"
          git push origin HEAD:security/quick-wins-round4
