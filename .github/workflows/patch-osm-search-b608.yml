name: Patch OSM search B608

on:
  push:
    branches:
      - security/quick-wins-round4
    paths:
      - .github/workflows/patch-osm-search-b608.yml
      - tools/_patch_osm_search_b608.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_patch_osm_search_b608.py
      - name: Verify syntax
        run: python -m py_compile app/osm_address.py
      - name: Verify B608 search finding
        run: |
          python -m pip install --disable-pip-version-check bandit
          bandit app/osm_address.py -f json -o /tmp/bandit.json || true
          python -c "import json; d=json.load(open('/tmp/bandit.json')); r=[x for x in d.get('results',[]) if x.get('test_id')=='B608' and x.get('line_number',0)>=1100]; assert not r, r"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-osm-search-b608.yml tools/_patch_osm_search_b608.py
          git add app/osm_address.py
          git commit -m "Use static OSM address search query"
          git push origin HEAD:security/quick-wins-round4
