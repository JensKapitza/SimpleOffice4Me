name: Merge main into security branch
on:
  push:
    paths:
      - '.github/workflows/merge-main-into-security.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SimpleOffice Security Bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          text = Path('app/mail_autoconfig.py').read_text(encoding='utf-8')
          start = text.index('def _fetch_mx(')
          end = text.index('\ndef _mx_provider_domains(', start)
          Path('/tmp/hardened_fetch_mx.txt').write_text(text[start:end], encoding='utf-8')
          PY
          git merge --no-ff -X theirs origin/main -m 'Merge current main into security quick wins'
          python - <<'PY'
          from pathlib import Path
          mail = Path('app/mail_autoconfig.py')
          text = mail.read_text(encoding='utf-8')
          start = text.index('def _fetch_mx(')
          end = text.index('\ndef _mx_provider_domains(', start)
          hardened = Path('/tmp/hardened_fetch_mx.txt').read_text(encoding='utf-8')
          mail.write_text(text[:start] + hardened + text[end:], encoding='utf-8')

          path = Path('simpleoffice_network_boot.py')
          text = path.read_text(encoding='utf-8')
          marker = 'from simpleoffice_mini_services import _atomic_write, default_config_path, state_dir\n'
          constant = marker + '\nUNSPECIFIED_IPV4 = socket.inet_ntoa(bytes(4))\n'
          if 'UNSPECIFIED_IPV4 = ' not in text:
              if marker not in text:
                  raise SystemExit('network boot import marker not found')
              text = text.replace(marker, constant, 1)
          text = text.replace('tftp_bind == "0.0.0.0"', 'tftp_bind == UNSPECIFIED_IPV4')
          text = text.replace('bind == "0.0.0.0"', 'bind == UNSPECIFIED_IPV4')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_mail_autoconfig.py')
          test_text = test_path.read_text(encoding='utf-8')
          start = test_text.index('    def test_fetch_mx_prefers_lowest_priority_and_parses_targets(self):')
          boundaries = []
          for marker in ('\n    @patch("app.mail_autoconfig._fetch_mx"', '\n    def test_'):
              pos = test_text.find(marker, start + 1)
              if pos != -1:
                  boundaries.append(pos)
          if not boundaries:
              raise SystemExit('next MX test boundary not found')
          end = min(boundaries)
          replacement = '''    def test_fetch_mx_prefers_lowest_priority_and_parses_targets(self):\n        import app.mail_autoconfig as mail_autoconfig\n\n        payload = b'{"Status":0,"Answer":[{"type":15,"data":"20 mx2.provider.net."},{"type":15,"data":"10 mx1.provider.net."}]}'\n        with patch.object(mail_autoconfig, "_https_get", return_value=payload) as https_get:\n            records = mail_autoconfig._fetch_mx("example.org")\n        self.assertEqual([(10, "mx1.provider.net"), (20, "mx2.provider.net")], records)\n        _, kwargs = https_get.call_args\n        self.assertEqual("dns.google", kwargs["fixed_host"])\n        self.assertFalse(kwargs["provider_owned"])\n'''
          test_path.write_text(test_text[:start] + replacement + test_text[end:], encoding='utf-8')
          PY
          git add app/mail_autoconfig.py simpleoffice_network_boot.py tests/test_mail_autoconfig.py
          git commit --amend --no-edit
      - name: Verify merged tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tools *.py
          python -m pip install --disable-pip-version-check -e . pip-audit bandit
          python -m pip_audit .
          set +e
          bandit -r app tools *.py -x tests,libs -ll -ii -f json -o /tmp/bandit.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          data=json.load(open('/tmp/bandit.json', encoding='utf-8'))
          medium=[item for item in data.get('results',[]) if item.get('issue_severity') in {'MEDIUM','HIGH'}]
          if medium:
              for item in medium:
                  print(item.get('test_id'), item.get('filename'), item.get('line_number'), item.get('issue_text'))
              raise SystemExit(f'{len(medium)} medium/high Bandit finding(s) remain')
          print('Bandit medium/high findings: 0')
          PY
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
      - name: Verify MX resolver behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from unittest.mock import patch
          import app.mail_autoconfig as module
          payload = b'{"Status":0,"Answer":[{"type":15,"data":"20 mx2.provider.net."},{"type":15,"data":"10 mx1.provider.net."}]}'
          with patch.object(module, '_https_get', return_value=payload) as mocked:
              records = module._fetch_mx('example.org')
          if records != [(10, 'mx1.provider.net'), (20, 'mx2.provider.net')] or mocked.call_count != 1:
              raise SystemExit('merged MX resolver behavior is incorrect')
          PY
      - name: Run security regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_auth tests.test_mail_autoconfig tests.test_webdav_download_security tests.test_xml_security_regressions -v
      - name: Finalize and push merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/merge-main-into-security.yml
          git commit --amend --no-edit
          git push origin HEAD:security/quick-wins-round4
