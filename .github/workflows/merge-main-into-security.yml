name: Merge main into security branch
on:
  push:
    paths:
      - '.github/workflows/merge-main-into-security.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/quick-wins-round4
          fetch-depth: 0
          persist-credentials: true
      - name: Attempt merge and report conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SimpleOffice Security Bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff origin/main -m 'Merge current main into security quick wins'
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'MERGE_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'MERGE_CONFLICTS_END'
            python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          for name in paths:
              print(f'===== CONFLICT {name} =====')
              lines = Path(name).read_text(encoding='utf-8', errors='replace').splitlines()
              marks = [i for i,l in enumerate(lines) if l.startswith('<<<<<<< ')]
              for idx in marks:
                  end = idx
                  while end < len(lines) and not lines[end].startswith('>>>>>>> '):
                      end += 1
                  start = max(0, idx - 12)
                  stop = min(len(lines), end + 13)
                  for n in range(start, stop):
                      print(f'{n+1:05d}: {lines[n]}')
                  print('-----')
          PY
            git merge --abort
            exit 1
          fi
          git rm .github/workflows/merge-main-into-security.yml
          git commit --amend --no-edit
          git push origin HEAD:security/quick-wins-round4
