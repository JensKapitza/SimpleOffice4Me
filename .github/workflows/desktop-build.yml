name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'desktop/**'
      - 'pyproject.toml'
      - 'tests/test_desktop_ocr_dependencies.py'
      - 'tools/generate_sbom.py'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Public endpoint only; never expose the GitHub token to desktop packages.
  SIMPLEOFFICE_ERROR_REPORT_URL: ${{ vars.SIMPLEOFFICE_ERROR_REPORT_URL }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24+
        shell: bash
        run: node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 24) process.exit(1); console.log(process.version)"
      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: >-
          npm ci --no-audit --no-fund
          --fetch-retries=5
          --fetch-retry-factor=2
          --fetch-retry-mintimeout=5000
          --fetch-retry-maxtimeout=60000
      - name: Install pinned SBOM packaging helper
        run: python -m pip install --require-hashes -r requirements-ci-tools.txt
      - name: Generate resolved Electron npm SBOM
        working-directory: .
        shell: bash
        run: |
          python tools/generate_sbom.py --npm-lock desktop/electron/package-lock.json \
            --output "artifacts/desktop/${{ matrix.artifact }}-npm.cdx.json" \
            --xml-output "artifacts/desktop/${{ matrix.artifact }}-npm.cdx.xml"
      - name: Synchronize desktop version
        working-directory: desktop/electron
        run: npm run sync:version
      - name: Embed public error relay configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = (process.env.SIMPLEOFFICE_ERROR_REPORT_URL || '').trim();
          if (value && !value.startsWith('https://')) {
            throw new Error('SIMPLEOFFICE_ERROR_REPORT_URL must use HTTPS');
          }
          fs.writeFileSync(
            'desktop/electron/build-config.json',
            JSON.stringify({ errorReportUrl: value }, null, 2) + '\n',
            'utf8'
          );
          NODE
      - name: Verify OCR dependency markers
        shell: bash
        run: python -m unittest discover -s tests -p test_desktop_ocr_dependencies.py
      - name: Build Python backend
        working-directory: desktop/electron
        run: npm run build:backend
      - name: Smoke-test frozen Python backend
        shell: bash
        run: |
          python desktop/python-setup/smoke_packaged_backend.py "desktop/python-setup/dist/simpleoffice-python${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Package Electron app
        working-directory: desktop/electron
        run: npm run package:desktop
      - name: Verify packaged backend payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path('desktop/electron/dist')
          binary = 'simpleoffice-python.exe' if sys.platform == 'win32' else 'simpleoffice-python'
          candidates = list(root.rglob(binary))
          if not candidates:
              raise SystemExit(f'Missing bundled backend {binary} in {root}')
          print('Packaged backends:', *candidates, sep='\n')
          PY
      - name: Install pinned CycloneDX CLI and validate the npm SBOM
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              asset=cyclonedx-linux-x64
              digest=bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
              ;;
            Windows/X64)
              asset=cyclonedx-win-x64.exe
              digest=9b360974c41a5d612eb026fb5e3bb1fa28e08865f7a4f915665b8bc94bd3bc31
              ;;
            macOS/X64)
              asset=cyclonedx-osx-x64
              digest=0ea92306fc7d7c30ed112a7463781a200585a3bf1cdaf77229181c5aabd1d4b6
              ;;
            macOS/ARM64)
              asset=cyclonedx-osx-arm64
              digest=750c148780154833f6401f9067d08c5a4c31567b6ee3c26c062c3a95c62d741c
              ;;
            *)
              printf 'Unsupported validator host: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          validator="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/$asset" \
            --output "$validator"
          python - "$validator" "$digest" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          digest = hashlib.sha256()
          with path.open("rb") as source:
              for block in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(block)
          if digest.hexdigest() != sys.argv[2]:
              raise SystemExit(f"CycloneDX CLI checksum mismatch for {path.name}")
          PY
          chmod 0755 "$validator"
          "$validator" validate --input-file "artifacts/desktop/${{ matrix.artifact }}-npm.cdx.json" \
            --input-format json --input-version v1_6 --fail-on-errors
          "$validator" validate --input-file "artifacts/desktop/${{ matrix.artifact }}-npm.cdx.xml" \
            --input-format xml --input-version v1_6 --fail-on-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-npm-sbom-${{ matrix.artifact }}
          path: artifacts/desktop/${{ matrix.artifact }}-npm.cdx.*
          if-no-files-found: error
      - name: Prepare installable Linux AppImage
        if: matrix.artifact == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          mapfile -t APPIMAGES < <(find desktop/electron/dist -maxdepth 1 -type f -name '*.AppImage' -print)
          if [ "${#APPIMAGES[@]}" -ne 1 ]; then
            printf 'Expected exactly one AppImage, found %s\n' "${#APPIMAGES[@]}" >&2
            printf '%s\n' "${APPIMAGES[@]:-}" >&2
            exit 1
          fi
          APPIMAGE="${APPIMAGES[0]}"
          case "$(basename "$APPIMAGE")" in
            *"$PROJECT_VERSION"*) ;;
            *)
              echo "AppImage filename does not contain project version $PROJECT_VERSION: $APPIMAGE" >&2
              exit 1
              ;;
          esac
          chmod +x "$APPIMAGE"
          file "$APPIMAGE" | grep -E 'ELF 64-bit.*x86-64'
          "$APPIMAGE" --appimage-version
          mkdir -p artifacts/linux
          OUTPUT="artifacts/linux/SimpleOffice4Me-Linux-x86_64.AppImage"
          cp "$APPIMAGE" "$OUTPUT"
          chmod +x "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
      - name: Upload installable Linux AppImage
        if: matrix.artifact == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpleoffice4me-linux-appimage-installable
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 14
      - name: Prepare macOS installer
        if: startsWith(matrix.artifact, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.artifact }}" in
            macos-arm64) expected=arm64 ;;
            macos-x64) expected=x64 ;;
            *) exit 1 ;;
          esac
          actual="$(node -p 'process.arch')"
          test "$actual" = "$expected" || { echo "Wrong macOS runner architecture: $actual (expected $expected)" >&2; exit 1; }
          # electron-builder emits a versioned DMG without an architecture suffix.
          # The native runner architecture is checked above; rename the artifact explicitly.
          set -- desktop/electron/dist/*.dmg
          test "$#" -eq 1 && test -f "$1" || { echo "Expected exactly one macOS DMG" >&2; exit 1; }
          mkdir -p artifacts/macos
          cp "$1" "artifacts/macos/SimpleOffice4Me-macos-$expected.dmg"
          printf 'Verified macOS %s DMG size: %s bytes\n' "$expected" "$(stat -f%z "$1")"
          (cd artifacts/macos && shasum -a 256 *.dmg > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!startsWith(matrix.artifact, 'macos-')"
        with:
          name: simpleoffice4me-desktop-${{ matrix.artifact }}
          path: desktop/electron/dist/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(matrix.artifact, 'macos-')
        with:
          name: simpleoffice4me-desktop-${{ matrix.artifact }}
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14
