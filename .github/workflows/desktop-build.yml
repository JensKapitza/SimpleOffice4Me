name: Desktop build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - 'pyproject.toml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24+
        shell: bash
        run: node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 24) process.exit(1); console.log(process.version)"
      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: npm install --no-audit --no-fund
      - name: Build Python backend
        working-directory: desktop/electron
        run: npm run build:backend
      - name: Package Electron app
        working-directory: desktop/electron
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: simpleoffice4me-desktop-${{ matrix.artifact }}
          path: desktop/electron/dist/**
          if-no-files-found: error
          retention-days: 14
