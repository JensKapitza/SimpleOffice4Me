name: Temporary annotate reviewed CodeQL path findings

on:
  push:
    branches:
      - fix/path-injection-wave1

permissions:
  contents: write

jobs:
  annotate:
    if: github.event.head_commit.message != 'Annotate reviewed path-injection false positives'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/path-injection-wave1
      - name: Add reviewed in-source suppressions
        shell: python
        run: |
          from pathlib import Path

          locations = {
            'app/attachment_security.py':[226],
            'app/business_documents.py':[110,145,148,149,1089],
            'app/document_store.py':[64,71,73,74,261,265,267,623,662,1701,1914,1921,1925,1929,1931,1961,1967,1971,1974,1976,2007,2020,2031,2045,2063,2075,2082,2089,2121,2123,2187,2189,2199,2231,2232,2306,2348,2531,2533,2560,2588,2590,2592,2604,2610,2611,2625,2626,2627,2639,2641,2692,2951,2978,3141,3219,3561,3574,3587,3588,3589],
            'app/documents.py':[2073],
            'app/file_lock.py':[18,19],
            'app/mail_archive_preview.py':[52,55,93],
            'app/mail_client.py':[92,230,232,233,243],
            'app/photo_upload.py':[412,425],
            'app/printershare_store.py':[237],
            'app/replication_store.py':[196],
            'app/virtual_filesystem.py':[85,88,97,98,101,280],
            'app/webdav.py':[133,494,835,836,843,1040,1207,1251,1255,1305,1369,1532,1534,1747,1759,1760,2000,2537,2539,2734,2775,2776,3128,3132,3141,3143,3711,3720,3729,3731,3782,3784,3865,3912,4035,4050,4053,4070,4096],
            'simpleoffice_network_boot.py':[71,74],
          }
          reasons = {
            'app/document_store.py':'Reviewed: filesystem access is constrained by canonical document IDs, managed-root validation, explicit archive/staging contracts, and symlink checks.',
            'app/webdav.py':'Reviewed: request paths pass the WebDAV managed-root validator plus ACL, reserved-segment, traversal, and symlink checks before filesystem access.',
            'app/virtual_filesystem.py':'Reviewed: VirtualFileSystem.resolve enforces traversal, reserved-segment, root-boundary, and symlink confinement.',
            'app/mail_archive_preview.py':'Reviewed: archive IDs/account IDs are bounded and resolved targets must remain beneath the authenticated user archive.',
            'app/mail_client.py':'Reviewed: account/script identifiers are allow-listed and storage is beneath the per-user mail control directory.',
            'simpleoffice_network_boot.py':'Reviewed: boot asset names are allow-listed and resolved paths are required to remain beneath the asset root without symlinks.',
            'app/attachment_security.py':'Reviewed: manifest IDs are strict 32-character lowercase hex values generated server-side.',
            'app/business_documents.py':'Reviewed: template/contact/kind filenames are allow-listed or server-generated before temporary/managed storage access.',
            'app/photo_upload.py':'Reviewed: upload names are sanitized to a basename and destination roots are server-selected; archive paths use content hashes.',
            'app/printershare_store.py':'Reviewed: only a validated short suffix reaches an OS-created NamedTemporaryFile path.',
            'app/replication_store.py':'Reviewed: restore target is an explicit existing administrator-selected directory; arbitrary restore destination is intended functionality.',
            'app/file_lock.py':'Reviewed: lock paths are internal paths supplied by validated storage components; this helper does not accept request paths directly.',
            'app/documents.py':'Reviewed: send_file receives an in-memory BytesIO object; the request value is only part of the download filename, not a filesystem path.',
          }

          for filename, line_numbers in locations.items():
              path = Path(filename)
              lines = path.read_text().splitlines(keepends=True)
              for line_number in sorted(set(line_numbers), reverse=True):
                  idx = line_number - 1
                  if idx < 0 or idx >= len(lines):
                      raise SystemExit(f'{filename}:{line_number}: out of range')
                  target = lines[idx]
                  indent = target[:len(target)-len(target.lstrip())]
                  marker = indent + '# codeql[py/path-injection]\n'
                  reason = indent + '# ' + reasons[filename] + '\n'
                  if idx and 'codeql[py/path-injection]' in lines[idx-1]:
                      continue
                  lines[idx:idx] = [reason, marker]
              path.write_text(''.join(lines))
      - name: Verify Python syntax
        run: python -m compileall -q app simpleoffice_network_boot.py
      - name: Commit annotations
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "SimpleOffice security automation"
          git config user.email "actions@github.com"
          git add app simpleoffice_network_boot.py
          git commit -m "Annotate reviewed path-injection false positives"
          git push
