plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def errorReportUrl = (System.getenv('SIMPLEOFFICE_ERROR_REPORT_URL') ?: '').trim()
if (errorReportUrl && !errorReportUrl.startsWith('https://')) {
    throw new GradleException('SIMPLEOFFICE_ERROR_REPORT_URL must use https://')
}
def escapedErrorReportUrl = errorReportUrl.replace('\\', '\\\\').replace('"', '\\"')

def androidAbi = (System.getenv('SIMPLEOFFICE_ANDROID_ABI') ?: 'arm64-v8a').trim()
def pythonRuntimeVersion = (System.getenv('SIMPLEOFFICE_ANDROID_PYTHON') ?: '3.13').trim()
def androidRuntimeProfiles = [
    'arm64-v8a': '3.13',
    'armeabi-v7a': '3.11',
]
def expectedPythonVersion = androidRuntimeProfiles[androidAbi]

def projectMetadata = file('../../../pyproject.toml')
if (!projectMetadata.isFile()) {
    throw new GradleException('Project version source pyproject.toml is missing')
}
def projectVersionMatch = projectMetadata.getText('UTF-8') =~ /(?ms)^\[project\]\s.*?^version\s*=\s*['"]([^'"]+)['"]/
if (!projectVersionMatch.find()) {
    throw new GradleException('Project version is missing from pyproject.toml [project]')
}
def appVersionName = projectVersionMatch.group(1).trim()
def semanticVersionMatch = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!semanticVersionMatch.matches()) {
    throw new GradleException("Android build requires a numeric MAJOR.MINOR.PATCH project version, got ${appVersionName}")
}
def appVersionCode = (
    semanticVersionMatch.group(1).toInteger() * 1_000_000
    + semanticVersionMatch.group(2).toInteger() * 1_000
    + semanticVersionMatch.group(3).toInteger()
)
if (appVersionCode <= 0 || appVersionCode > 2_100_000_000) {
    throw new GradleException("Derived Android versionCode is outside the supported range: ${appVersionCode}")
}

if (!expectedPythonVersion) {
    throw new GradleException("Unsupported Android ABI: ${androidAbi}")
}
if (pythonRuntimeVersion != expectedPythonVersion) {
    throw new GradleException(
        "Android ABI ${androidAbi} requires Python ${expectedPythonVersion}, got ${pythonRuntimeVersion}"
    )
}

android {
    namespace 'de.simpleoffice4me.android'
    compileSdk 36

    defaultConfig {
        applicationId 'de.simpleoffice4me.android'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'ERROR_REPORT_URL', "\"${escapedErrorReportUrl}\""

        ndk {
            abiFilters androidAbi
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/simpleofficeAssets"
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

chaquopy {
    defaultConfig {
        version = pythonRuntimeVersion
        def ciPython = System.getenv('CHAQUOPY_BUILD_PYTHON')
        if (ciPython) {
            buildPython(ciPython)
        }
        pip {
            install 'Flask==3.1.3'
            install 'cffi==1.17.1'
            install 'argon2-cffi-bindings==21.2.0'
            install 'argon2-cffi==23.1.0'
            install 'beautifulsoup4==4.14.2'
            install 'defusedxml==0.7.1'
            install 'Pillow==11.0.0'
            install 'reportlab==4.2.5'
            install 'pypdf==6.1.1'
            install 'cryptography==42.0.8'
            install 'tzdata==2026.2'
        }
    }
}

tasks.register('syncSimpleOfficeAssets', Sync) {
    into "$buildDir/generated/simpleofficeAssets/simpleoffice"
    from('../../..') {
        include 'app/**'
        include 'templates/**'
        include 'static/**'
        include 'tools/**'
        include 'simpleoffice_*.py'
        include 'pyproject.toml'
        exclude '**/__pycache__/**'
        exclude '**/*.pyc'
    }
    doLast {
        def architecture = androidAbi == 'armeabi-v7a' ? 'ARM32' : androidAbi == 'arm64-v8a' ? 'ARM64' : androidAbi
        def metadata = file("$buildDir/generated/simpleofficeAssets/simpleoffice/static/android-build.json")
        metadata.parentFile.mkdirs()
        metadata.text = groovy.json.JsonOutput.toJson([
            version: appVersionName,
            version_code: appVersionCode,
            abi: androidAbi,
            architecture: architecture,
            python: pythonRuntimeVersion,
            min_sdk: 24,
            target_sdk: 36,
        ])
    }
}

preBuild.dependsOn syncSimpleOfficeAssets
