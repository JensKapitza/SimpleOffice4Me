plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def errorReportUrl = (System.getenv('SIMPLEOFFICE_ERROR_REPORT_URL') ?: '').trim()
if (errorReportUrl && !errorReportUrl.startsWith('https://')) {
    throw new GradleException('SIMPLEOFFICE_ERROR_REPORT_URL must use https://')
}
def escapedErrorReportUrl = errorReportUrl.replace('\\', '\\\\').replace('"', '\\"')

def androidAbi = (System.getenv('SIMPLEOFFICE_ANDROID_ABI') ?: 'arm64-v8a').trim()
def pythonRuntimeVersion = (System.getenv('SIMPLEOFFICE_ANDROID_PYTHON') ?: '3.15').trim()
def androidRuntimeProfiles = [
    'arm64-v8a': '3.15',
]
def expectedPythonVersion = androidRuntimeProfiles[androidAbi]
def androidWheelDirectory = (System.getenv('SIMPLEOFFICE_ANDROID_WHEEL_DIR') ?: '').trim()
def localCffiWheel = null
def localArgon2BindingsWheel = null
def localPillowWheel = null
def localCryptographyWheel = null
def localReportlabWheel = null
if (androidWheelDirectory) {
    def wheelDirectory = file(androidWheelDirectory)
    if (!wheelDirectory.isDirectory()) {
        throw new GradleException("Android wheel directory does not exist: ${wheelDirectory}")
    }
    def cffiWheels = fileTree(dir: wheelDirectory).matching { include 'cffi-2.0.0-*.whl' }.files
    def argon2BindingsWheels = fileTree(dir: wheelDirectory).matching { include 'argon2_cffi_bindings-21.2.0-*.whl' }.files
    def pillowWheels = fileTree(dir: wheelDirectory).matching { include 'pillow-13.0.0-*.whl' }.files
    def cryptographyWheels = fileTree(dir: wheelDirectory).matching { include 'cryptography-48.0.1-*.whl' }.files
    def reportlabWheels = fileTree(dir: wheelDirectory).matching { include 'reportlab-4.2.5-py3-none-any.whl' }.files
    if (cffiWheels.size() != 1 || argon2BindingsWheels.size() != 1 || pillowWheels.size() != 1 || cryptographyWheels.size() != 1 || reportlabWheels.size() != 1) {
        def wheelNames = (wheelDirectory.listFiles() ?: [])
            .findAll { it.isFile() && it.name.endsWith('.whl') }
            .collect { it.name }
            .sort()
        throw new GradleException(
            'Android wheel directory must contain exactly one verified cffi 2.0.0, '
            + 'argon2-cffi-bindings 21.2.0, Pillow 13.0.0, cryptography 48.0.1, and ReportLab 4.2.5 wheel. '
            + "Match counts: cffi=${cffiWheels.size()}, argon2=${argon2BindingsWheels.size()}, "
            + "Pillow=${pillowWheels.size()}, cryptography=${cryptographyWheels.size()}, "
            + "ReportLab=${reportlabWheels.size()}; wheel files: ${wheelNames}"
        )
    }
    localCffiWheel = cffiWheels.first()
    localArgon2BindingsWheel = argon2BindingsWheels.first()
    localPillowWheel = pillowWheels.first()
    localCryptographyWheel = cryptographyWheels.first()
    localReportlabWheel = reportlabWheels.first()
}

def projectMetadata = file('../../../pyproject.toml')
if (!projectMetadata.isFile()) {
    throw new GradleException('Project version source pyproject.toml is missing')
}
def projectVersionMatch = projectMetadata.getText('UTF-8') =~ /(?ms)^\[project\]\s.*?^version\s*=\s*['"]([^'"]+)['"]/
if (!projectVersionMatch.find()) {
    throw new GradleException('Project version is missing from pyproject.toml [project]')
}
def projectReleaseVersion = projectVersionMatch.group(1).trim()
def majorMatch = projectReleaseVersion =~ /^(\d+)\.\d+\.\d+$/
if (!majorMatch.matches()) {
    throw new GradleException("Expected MAJOR.MINOR.PATCH project version, got ${projectReleaseVersion}")
}
def versionMajor = majorMatch.group(1).toInteger()
def buildDate = (System.getenv('SIMPLEOFFICE_BUILD_DATE') ?: java.time.LocalDate.now(java.time.ZoneOffset.UTC).format(java.time.format.DateTimeFormatter.BASIC_ISO_DATE)).trim()
if (!(buildDate ==~ /\d{8}/)) {
    throw new GradleException("SIMPLEOFFICE_BUILD_DATE must be YYYYMMDD")
}
def parsedBuildDate
try {
    parsedBuildDate = java.time.LocalDate.parse(buildDate, java.time.format.DateTimeFormatter.BASIC_ISO_DATE)
} catch (java.time.format.DateTimeParseException exc) {
    throw new GradleException("Invalid build date: ${buildDate}", exc)
}
def rawBuildSequence = (System.getenv('SIMPLEOFFICE_BUILD_SEQUENCE') ?: '1').trim()
if (!(rawBuildSequence ==~ /[1-9]\d{0,3}/)) {
    throw new GradleException('SIMPLEOFFICE_BUILD_SEQUENCE must be 1..9999')
}
def buildSequence = rawBuildSequence.toInteger()
def daysSinceEpoch = java.time.temporal.ChronoUnit.DAYS.between(java.time.LocalDate.of(2020, 1, 1), parsedBuildDate)
if (daysSinceEpoch < 0 || daysSinceEpoch > 200000) {
    throw new GradleException('Build date is outside the supported range')
}
// Android versionCode must increase for upgrades and fit into a signed int.
// Sequence is the GitHub workflow run number, not an issue number or commit hash.
def calculatedVersionCode = daysSinceEpoch * 10000L + buildSequence
if (calculatedVersionCode <= 0 || calculatedVersionCode > 2_100_000_000L) {
    throw new GradleException("Android versionCode is outside the supported range: ${calculatedVersionCode}")
}
def appVersionCode = calculatedVersionCode.toInteger()
def appVersionName = "${versionMajor}.${buildDate}.${buildSequence}"

if (!expectedPythonVersion) {
    throw new GradleException("Unsupported Android ABI: ${androidAbi}")
}
if (pythonRuntimeVersion != expectedPythonVersion) {
    throw new GradleException(
        "Android ABI ${androidAbi} requires Python ${expectedPythonVersion}, got ${pythonRuntimeVersion}"
    )
}

android {
    namespace 'de.simpleoffice4me.android'
    compileSdk 36

    defaultConfig {
        applicationId 'de.simpleoffice4me.android'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'ERROR_REPORT_URL', "\"${escapedErrorReportUrl}\""

        ndk {
            abiFilters androidAbi
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/simpleofficeAssets"
            res.srcDir "$buildDir/generated/simpleofficeLogoRes"
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

chaquopy {
    defaultConfig {
        version = pythonRuntimeVersion
        def ciPython = System.getenv('CHAQUOPY_BUILD_PYTHON')
        if (ciPython) {
            buildPython(ciPython)
        }
        pip {
            install 'Flask==3.1.3'
            if (localCffiWheel) {
                install localCffiWheel.absolutePath
            } else {
                install 'cffi==2.0.0'
            }
            if (localArgon2BindingsWheel) {
                install localArgon2BindingsWheel.absolutePath
            } else {
                install 'argon2-cffi-bindings==21.2.0'
            }
            install 'argon2-cffi==23.1.0'
            install 'beautifulsoup4==4.14.2'
            install 'defusedxml==0.7.1'
            if (localPillowWheel) {
                install localPillowWheel.absolutePath
            } else {
                install 'Pillow==13.0.0'
            }
            if (localReportlabWheel) {
                install localReportlabWheel.absolutePath
            } else {
                install 'reportlab==4.2.5'
            }
            install 'pypdf==6.1.1'
            if (localCryptographyWheel) {
                install localCryptographyWheel.absolutePath
            } else {
                install 'cryptography==48.0.1'
            }
            install 'tzdata==2026.2'
        }
    }
}

tasks.register('syncSimpleOfficeAssets', Sync) {
    into "$buildDir/generated/simpleofficeAssets/simpleoffice"
    from('../../..') {
        include 'app/**'
        include 'templates/**'
        include 'static/**'
        include 'tools/**'
        include 'simpleoffice_*.py'
        include 'pyproject.toml'
        exclude '**/__pycache__/**'
        exclude '**/*.pyc'
    }
    doLast {
        def architecture = androidAbi == 'armeabi-v7a' ? 'ARM32' : androidAbi == 'arm64-v8a' ? 'ARM64' : androidAbi
        def metadata = file("$buildDir/generated/simpleofficeAssets/simpleoffice/static/android-build.json")
        metadata.parentFile.mkdirs()
        metadata.text = groovy.json.JsonOutput.toJson([
            version: appVersionName,
            version_code: appVersionCode,
            abi: androidAbi,
            architecture: architecture,
            python: pythonRuntimeVersion,
            min_sdk: 24,
            target_sdk: 36,
        ])
    }
}

preBuild.dependsOn syncSimpleOfficeAssets

// Derive all density-specific launcher bitmaps from the canonical project logo.
tasks.register('generateSimpleOfficeLauncherIcons') {
    def logo = file('../../../docs/assets/simpleoffice-documentation-logo.png')
    inputs.file(logo)
    outputs.dir(layout.buildDirectory.dir('generated/simpleofficeLogoRes'))
    doLast {
        if (!logo.isFile()) throw new GradleException("Missing launcher logo: ${logo}")
        def original = javax.imageio.ImageIO.read(logo)
        if (original == null || original.width < 192 || original.height < 192) {
            throw new GradleException("Launcher logo must be a readable PNG of at least 192x192")
        }
        def resources = file("$buildDir/generated/simpleofficeLogoRes")
        def densities = ['mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192]
        densities.each { density, size ->
            def directory = new File(resources, "mipmap-${density}")
            directory.mkdirs()
            def result = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = result.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.drawImage(original, 0, 0, size, size, null)
            } finally { graphics.dispose() }
            javax.imageio.ImageIO.write(result, 'png', new File(directory, 'ic_launcher.png'))
            javax.imageio.ImageIO.write(result, 'png', new File(directory, 'ic_launcher_round.png'))
        }
        // Adaptive icons use a padded foreground within a 108dp viewport.
        def foregroundDir = new File(resources, 'drawable-nodpi')
        foregroundDir.mkdirs()
        def canvas = new java.awt.image.BufferedImage(432, 432, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = canvas.createGraphics()
        try {
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.drawImage(original, 81, 81, 270, 270, null)
        } finally { graphics.dispose() }
        javax.imageio.ImageIO.write(canvas, 'png', new File(foregroundDir, 'simpleoffice_logo_foreground.png'))
    }
}
preBuild.dependsOn generateSimpleOfficeLauncherIcons


// Export the actual resolved Gradle runtime graph, not merely declared dependencies.
// Chaquopy pip wheels are separate and must be inventoried from the packaged APK.
tasks.register('exportResolvedAndroidDependencies') {
    def outputFile = layout.buildDirectory.file('reports/sbom/gradle-runtime.json')
    outputs.file(outputFile)
    doLast {
        def configuration = configurations.getByName('debugRuntimeClasspath')
        def resolution = configuration.incoming.resolutionResult
        def components = [:]
        def edges = [:]
        def rootDependencies = []
        resolution.root.dependencies.each { dependency ->
            if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                def selected = dependency.selected.moduleVersion
                if (selected != null) {
                    rootDependencies.add("${selected.group}:${selected.name}:${selected.version}")
                }
            }
        }
        resolution.allComponents.each { component ->
            def module = component.moduleVersion
            if (module == null) return
            def key = "${module.group}:${module.name}:${module.version}"
            components[key] = [group: module.group, name: module.name, version: module.version]
            def dependencies = []
            component.dependencies.each { dependency ->
                if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                    def selected = dependency.selected.moduleVersion
                    if (selected != null) {
                        dependencies.add("${selected.group}:${selected.name}:${selected.version}")
                    }
                }
            }
            edges[key] = dependencies.unique().sort()
        }
        def result = [components: components.values().toList().sort { a, b ->
            "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}"
        }, dependencies: edges, application: [
            name: 'SimpleOffice4Me Android',
            version: appVersionName,
            bomRef: "urn:simpleoffice4me:android:${androidAbi}:python-${pythonRuntimeVersion}",
        ], rootDependencies: rootDependencies.unique().sort()]
        def output = outputFile.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
    }
}
